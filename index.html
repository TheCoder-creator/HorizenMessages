<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HorizenMessages</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/plugin/relativeTime.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--bg4:#222230;--border:#2a2a3a;--accent:#6c63ff;--accent2:#a78bfa;--accent3:#38bdf8;--green:#22d3a0;--red:#f43f5e;--yellow:#fbbf24;--text:#e8e8f0;--text2:#9090a8;--text3:#5a5a72;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;}
h1,h2,h3{font-family:'Syne',sans-serif;}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:radial-gradient(ellipse at 30% 20%,#1a1040 0%,var(--bg) 60%),radial-gradient(ellipse at 80% 80%,#0a1a30 0%,transparent 60%);}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:44px;width:410px;box-shadow:0 40px 80px rgba(0,0,0,.5);}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent3));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.logo h1{font-size:21px;font-weight:800;}.logo span{color:var(--accent2);}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:26px;}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);border-radius:7px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;transition:all .2s;}
.auth-tab.active{background:var(--accent);color:#fff;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;letter-spacing:.5px;}
.fg input{width:100%;padding:11px 15px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--accent);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .2s;}
.btn-primary:hover{opacity:.88;}
.auth-error{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:14px;display:none;}

/* APP */
#app{display:none;height:100vh;}
#app.show{display:flex;}

/* NAV RAIL */
.nav-rail{width:58px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex-shrink:0;}
.nav-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent3));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:14px;}
.nav-btn{width:42px;height:42px;border-radius:11px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;transition:all .2s;position:relative;}
.nav-btn:hover{background:var(--bg3);color:var(--text2);}
.nav-btn.active{background:rgba(108,99,255,.15);color:var(--accent2);}
.nav-btn .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg2);}
.nav-spacer{flex:1;}
.nav-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-top:8px;}

/* SIDEBAR */
.sidebar{width:290px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.panel.active{display:flex;}
.panel-hdr{padding:18px 14px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.sbox{padding:9px 11px;}
.sbox-wrap{position:relative;}
.sbox input{width:100%;padding:7px 11px 7px 30px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;}
.sbox input:focus{border-color:var(--accent);}
.sbox-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;}
.ls{flex:1;overflow-y:auto;padding:5px 7px;}
.ls::-webkit-scrollbar{width:3px;}
.ls::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sec-lbl{padding:6px 7px 2px;font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;font-family:'Syne',sans-serif;font-weight:600;}
.fi{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;cursor:pointer;transition:background .15s;}
.fi:hover{background:var(--bg3);}
.fi.active{background:rgba(108,99,255,.15);}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex-shrink:0;position:relative;}
.av.sm{width:30px;height:30px;font-size:11px;}
.av.xs{width:24px;height:24px;font-size:9px;}
.sdot{position:absolute;bottom:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--text3);border:2px solid var(--bg2);}
.sdot.on{background:var(--green);}
.fi-info{flex:1;min-width:0;}
.fi-name{font-weight:600;font-size:13px;font-family:'Syne',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fi-sub{font-size:11px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fi-sub.on{color:var(--green);}
.fi-meta{text-align:right;flex-shrink:0;}
.fi-time{color:var(--text3);font-size:10px;}
.fi-acts{display:flex;gap:3px;}
.fbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;}
.fbtn:hover{border-color:var(--accent);color:var(--accent2);}
.fbtn.acc:hover{border-color:var(--green);color:var(--green);}
.fbtn.dec:hover{border-color:var(--red);color:var(--red);}
.req-count{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:5px;}

/* CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--bg2);}
.chat-hdr-info{flex:1;}
.chat-hdr-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.chat-hdr-status{color:var(--text2);font-size:11px;margin-top:1px;}
.chat-hdr-acts{display:flex;gap:6px;}
.cbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;}
.cbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.cbtn.vid:hover{background:var(--accent3);border-color:var(--accent3);color:var(--bg);}
.cbtn.ai-btn{background:rgba(108,99,255,.12);border-color:rgba(108,99,255,.3);color:var(--accent2);}
.cbtn.ai-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;background:var(--bg);}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.mrow{display:flex;align-items:flex-end;gap:7px;margin-bottom:2px;}
.mrow.mine{flex-direction:row-reverse;}
.mrow.mine .mav{display:none;}
.mav{flex-shrink:0;}
.mbub{max-width:66%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.mbub.theirs{background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.mbub.mine{background:linear-gradient(135deg,var(--accent),#7c3aed);border-bottom-right-radius:4px;color:#fff;margin-left:auto;}
.mbub.call-ev{background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);color:var(--text2);font-size:12px;padding:8px 14px;}
.mbub.ai-msg{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(108,99,255,.15));border:1px solid rgba(108,99,255,.25);border-bottom-left-radius:4px;color:var(--text);}
.mtime{font-size:10px;color:var(--text3);padding:0 3px;flex-shrink:0;align-self:flex-end;margin-bottom:2px;}
.day-div{text-align:center;color:var(--text3);font-size:10px;letter-spacing:1px;margin:10px 0;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--border);}
.file-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg4);border-radius:12px;max-width:260px;text-decoration:none;border:1px solid var(--border);}
.file-icon{font-size:22px;flex-shrink:0;}
.file-info{flex:1;min-width:0;}
.file-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-size{font-size:11px;color:var(--text2);}

/* TYPING INDICATOR */
.typing-row{display:flex;align-items:center;gap:8px;padding:4px 0 6px;min-height:28px;}
.typing-label{font-size:11px;color:var(--text3);font-style:italic;}
.typing-dots{display:flex;gap:3px;align-items:center;}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:tdot 1.3s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}

/* AI WORD SUGGESTION */
.ai-suggest{display:none;align-items:center;gap:6px;padding:5px 11px 0;}
.ai-suggest.show{display:flex;}
.suggest-chip{padding:4px 10px;background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.3);border-radius:20px;font-size:12px;color:var(--accent2);cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;}
.suggest-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.suggest-label{font-size:10px;color:var(--text3);flex-shrink:0;}

/* ai typing anim */
.ai-typing{display:flex;gap:4px;align-items:center;padding:6px 2px;}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:blink 1.2s infinite;}
.ai-typing span:nth-child(2){animation-delay:.2s;}
.ai-typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* INPUT */
.chat-input-area{border-top:1px solid var(--border);background:var(--bg2);}
.file-preview-bar{display:none;align-items:center;gap:8px;padding:8px 18px 0;}
.file-preview-bar.show{display:flex;}
.fp-inner{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:7px 11px;flex:1;}
.file-preview-name{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-preview-rm{width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;}
.input-wrap{padding:10px 18px 12px;}
.irow{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:15px;padding:8px 11px;transition:border-color .2s;}
.irow:focus-within{border-color:var(--accent);}
.attach-btn,.emoji-btn{width:28px;height:28px;border-radius:7px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:color .2s;}
.attach-btn:hover,.emoji-btn:hover{color:var(--accent2);}
#msg-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;resize:none;max-height:120px;line-height:1.5;}
#msg-input::placeholder{color:var(--text3);}
.send-btn{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:opacity .2s;}
.send-btn:hover{opacity:.85;}
#file-input{display:none;}

/* EMOJI PICKER */
.emoji-picker{position:absolute;bottom:70px;left:18px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:12px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;z-index:500;}
.emoji-picker.show{display:block;}
.emoji-cats{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;}
.emoji-cat{padding:5px 10px;border-radius:20px;border:none;background:transparent;cursor:pointer;font-size:15px;transition:background .15s;}
.emoji-cat:hover,.emoji-cat.active{background:var(--bg3);}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:180px;overflow-y:auto;}
.emoji-grid::-webkit-scrollbar{width:3px;}
.emoji-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.emoji-btn-grid{width:34px;height:34px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:18px;transition:background .15s;display:flex;align-items:center;justify-content:center;}
.emoji-btn-grid:hover{background:var(--bg3);}

/* EMPTY STATE */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:11px;}
.empty-state .ei{font-size:50px;}
.empty-state h3{font-family:'Syne',sans-serif;color:var(--text2);font-size:17px;}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-ov.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:26px;width:390px;box-shadow:0 40px 80px rgba(0,0,0,.5);}
.modal h2{font-size:17px;margin-bottom:16px;}
.usr-res{max-height:200px;overflow-y:auto;margin-top:7px;}
.ures{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer;transition:background .15s;justify-content:space-between;}
.ures:hover{background:var(--bg3);}
.ures-l{display:flex;align-items:center;gap:9px;}
.modal-acts{display:flex;gap:8px;margin-top:16px;}
.btn-sec{flex:1;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Syne',sans-serif;font-weight:600;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-sec:hover{border-color:var(--accent);color:var(--accent);}
.bsm{padding:4px 11px;border-radius:7px;border:none;font-family:'Syne',sans-serif;font-weight:600;font-size:11px;cursor:pointer;}
.bsm.add{background:var(--accent);color:#fff;}
.bsm.pend{background:var(--bg4);color:var(--text3);cursor:default;}
.icon-btn{width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;transition:all .2s;}
.icon-btn:hover{color:var(--accent2);border-color:var(--accent);}

/* CALL NOTIFICATION (incoming/outgoing) */
.call-notif{position:fixed;top:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px 20px;width:300px;display:none;z-index:3000;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideIn .3s ease;}
@keyframes slideIn{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.call-notif.show{display:block;}
.cn-type{font-size:10px;letter-spacing:1px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;}
.cn-who{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cn-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;}
.cn-av.pulse{animation:pulse-ring 1.5s infinite;}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(108,99,255,.5);}50%{box-shadow:0 0 0 10px rgba(108,99,255,0);}}
.cn-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.cn-sub{font-size:11px;color:var(--text2);}
.cn-btns{display:flex;gap:8px;}
.cn-btn{flex:1;padding:9px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;transition:opacity .2s;}
.cn-btn:hover{opacity:.85;}
.cn-btn.acc{background:var(--green);color:var(--bg);}
.cn-btn.dec{background:var(--red);color:#fff;}
.cn-btn.cancel{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:100%;}

/* VIDEO CALL */
#video-overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:2000;}
#video-overlay.show{display:flex;}
#remote-video{width:100%;height:100%;object-fit:cover;background:#111;}
#local-video{position:absolute;bottom:115px;right:18px;width:145px;height:92px;border-radius:11px;object-fit:cover;border:2px solid var(--border);background:#222;}
.vid-ctrls{position:absolute;bottom:0;left:0;right:0;padding:18px;display:flex;justify-content:center;gap:13px;background:linear-gradient(transparent,rgba(0,0,0,.85));}
.vid-info{position:absolute;top:16px;left:16px;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);}
.vid-status{position:absolute;top:44px;left:16px;font-size:12px;color:rgba(255,255,255,.7);}
.cctrl{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;}
.cctrl.mute{background:rgba(255,255,255,.15);color:#fff;}
.cctrl.mute:hover{background:rgba(255,255,255,.25);}
.cctrl.cam{background:rgba(255,255,255,.15);color:#fff;font-size:17px;}
.cctrl.cam:hover{background:rgba(255,255,255,.25);}
.cctrl.end{background:var(--red);color:#fff;width:62px;height:62px;font-size:22px;}
.cctrl.end:hover{background:#e11d48;}

/* AI PANEL */
#ai-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:flex-end;z-index:1500;padding:20px;}
#ai-overlay.show{display:flex;}
.ai-panel{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:380px;height:520px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.ai-hdr{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ai-hdr-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:15px;}
.ai-hdr-info{flex:1;}
.ai-hdr-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.ai-hdr-model{font-size:10px;color:var(--text3);}
.ai-close{width:26px;height:26px;border-radius:7px;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:15px;}
.ai-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.ai-msgs::-webkit-scrollbar{width:3px;}
.ai-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ai-irow{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}
#ai-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;resize:none;max-height:80px;line-height:1.5;}

  </div>
</div>

// ── EMOJI PICKER ──
let emojiPickerBuilt = false;
function buildEmojiPicker() {
  if(emojiPickerBuilt) return; emojiPickerBuilt = true;
  const cats = document.getElementById('emoji-cats');
  const grid = document.getElementById('emoji-grid');
  EMOJI_CATS.forEach((cat, i) => {
    const b = document.createElement('button');
    b.className = 'emoji-cat' + (i===0?' active':'');
    b.title = cat.name; b.textContent = cat.icon;
    b.onclick = () => {
      document.querySelectorAll('.emoji-cat').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderEmojiGrid(cat.emojis);
    };
    cats.appendChild(b);
  });
  renderEmojiGrid(EMOJI_CATS[0].emojis);
}
function renderEmojiGrid(emojis) {
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  emojis.forEach(e => {
    const b = document.createElement('button');
    b.className = 'emoji-btn-grid'; b.textContent = e;
    b.onclick = () => insertEmoji(e);
    grid.appendChild(b);
  });
}
function toggleEmojiPicker(ev) {
  ev.stopPropagation();
  buildEmojiPicker();
  document.getElementById('emoji-picker').classList.toggle('show');
}
function closeEmojiPicker() { document.getElementById('emoji-picker').classList.remove('show'); }
function insertEmoji(e) {
  const inp = document.getElementById('msg-input');
  const pos = inp.selectionStart;
  inp.value = inp.value.slice(0,pos) + e + inp.value.slice(inp.selectionEnd);
  inp.selectionStart = inp.selectionEnd = pos + e.length;
  inp.focus();
  autoResize(inp);
  closeEmojiPicker();
}

// ── AUTH ──
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
}
function showAuthErr(m) { const e=document.getElementById('auth-error'); e.textContent=m; e.style.display='block'; }
async function doLogin() {
  const email=document.getElementById('login-email').value.trim(), pass=document.getElementById('login-pass').value;
  if(!email||!pass) return showAuthErr('Fill in all fields');
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error) return showAuthErr(error.message);
  onAuth(data.user);
}
async function doSignup() {
  const username=document.getElementById('signup-username').value.trim();
  const email=document.getElementById('signup-email').value.trim();
  const pass=document.getElementById('signup-pass').value;
  if(!username||!email||!pass) return showAuthErr('Fill in all fields');
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error) return showAuthErr(error.message);
  if(data.user){
    const {error:pe}=await sb.from('profiles').insert({id:data.user.id,username,display_name:username,status:'online'});
    if(pe) return showAuthErr(pe.message);
    onAuth(data.user);
  } else showAuthErr('Check your email to confirm');
}
async function doLogout() {
  if(myProfile) await sb.from('profiles').update({status:'offline',last_seen:new Date().toISOString()}).eq('id',myProfile.id);
  await sb.auth.signOut(); location.reload();
}
async function onAuth(user) {
  me = user;
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!p) return showAuthErr('Profile not found. Please sign up.');
  myProfile = p;
  await sb.from('profiles').update({status:'online'}).eq('id',user.id);
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  document.getElementById('my-av').textContent = p.username[0].toUpperCase();
  loadFriends();
  subscribeCallChannel();
  subscribeFriendEvents();
}

// ── FRIENDS ──
async function loadFriends() {
  const {data:acc}=await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*), addressee:profiles!friendships_addressee_id_fkey(*)')
    .or(`requester_id.eq.${myProfile.id},addressee_id.eq.${myProfile.id}`)
    .eq('status','accepted');
  friends = (acc||[]).map(f=>f.requester_id===myProfile.id?f.addressee:f.requester);
  const {data:pend}=await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*)')
    .eq('addressee_id',myProfile.id).eq('status','pending');
  pendingReqs = pend||[];
  renderFriendList();
  renderPendingList();
  updateReqBadge();
}
function updateReqBadge() {
  const b=document.getElementById('req-badge'), l=document.getElementById('req-count-label');
  if(pendingReqs.length){ b.style.display='block'; l.innerHTML=`<span class="req-count">${pendingReqs.length}</span>`; }
  else { b.style.display='none'; l.innerHTML=''; }
}
async function renderFriendList() {
  const el=document.getElementById('friend-list');
  if(!friends.length){ el.innerHTML='<div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">No friends yet.<br>Click ➕ to add someone!</div>'; return; }

async function openChat(friend) {
  activeFriend=friend;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('active-chat').style.display='flex';
  document.getElementById('chat-av').textContent=(friend.display_name||friend.username)[0].toUpperCase();
  document.getElementById('chat-name').textContent=friend.display_name||friend.username;
  document.getElementById('chat-status').textContent=friend.status==='online'?'● Online':`Last seen ${dayjs(friend.last_seen).fromNow()}`;
  document.querySelectorAll('.fi').forEach(e=>e.classList.toggle('active',e.dataset.fid===friend.id));
  if(msgSub) msgSub.unsubscribe();
  if(typingCh) typingCh.unsubscribe();
  clearTypingIndicator();
  document.getElementById('ai-suggest').classList.remove('show');
  await loadChatMsgs();
  const chanKey=[myProfile.id,friend.id].sort().join('-');
  msgSub=sb.channel(`dm:${chanKey}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
      const m=p.new;
      if((m.sender_id===myProfile.id&&m.sent_to===friend.id)||(m.sender_id===friend.id&&m.sent_to===myProfile.id)) appendMsg(m);
    })
    .subscribe();
  // Typing indicator channel
  typingCh=sb.channel(`typing:${chanKey}`)
    .on('broadcast',{event:'typing'},payload=>{
      if(payload.payload.uid!==myProfile.id) showFriendTyping(payload.payload.name);
    })
    .on('broadcast',{event:'stop_typing'},payload=>{
      if(payload.payload.uid!==myProfile.id) clearTypingIndicator();
    })
    .subscribe();
}

// ── MESSAGES ──
async function loadChatMsgs(){
  const {data}=await sb.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${myProfile.id},sent_to.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},sent_to.eq.${myProfile.id})`)
    .order('created_at',{ascending:true});
  chatMsgs=data||[];
  renderMsgs();
}
function renderMsgs(){
  const c=document.getElementById('msgs'); c.innerHTML='';
  let lastD=null;
  for(const m of chatMsgs){
    const d=dayjs(m.created_at).format('MMMM D, YYYY');
    if(d!==lastD){ const dv=document.createElement('div'); dv.className='day-div'; dv.textContent=d; c.appendChild(dv); lastD=d; }
    renderOneMsg(m,c);
  }
  c.scrollTop=c.scrollHeight;
}
function appendMsg(m){
  chatMsgs.push(m);
  renderOneMsg(m,document.getElementById('msgs'));
  document.getElementById('msgs').scrollTop=9999;
  renderFriendList();
}
function renderOneMsg(m,c){
  const mine=m.sender_id===myProfile.id;
  const row=document.createElement('div');
  row.className=`mrow ${mine?'mine':''}`;
  const initials=activeFriend?(activeFriend.display_name||activeFriend.username)[0].toUpperCase():'?';
  const timeStr=dayjs(m.created_at).format('h:mm A');
  let inner='';
  if(m.type==='call'){
    inner=`<div class="mbub call-ev" style="${mine?'margin-left:auto':''}">📞 ${escH(m.content)}</div><div class="mtime">${timeStr}</div>`;
  } else if(m.type==='file'){
    const icon=fileIcon(m.content);
    const fb=`<a class="file-bubble" href="${m.file_url||'#'}" target="_blank" download>
      <span class="file-icon">${icon}</span>
      <div class="file-info"><div class="file-name">${escH(m.content)}</div><div class="file-size">${m.file_size?fmtSize(m.file_size):''}</div></div>
      <span style="color:var(--accent2);font-size:13px">⬇</span></a>`;
    inner=mine?`<div class="mtime">${timeStr}</div>${fb}`:`<div class="av xs mav">${initials}</div>${fb}<div class="mtime">${timeStr}</div>`;
  } else {
    inner=mine?`<div class="mtime">${timeStr}</div><div class="mbub mine">${escH(m.content)}</div>`
              :`<div class="av xs mav">${initials}</div><div class="mbub theirs">${escH(m.content)}</div><div class="mtime">${timeStr}</div>`;
  }
  row.innerHTML=inner;
  c.appendChild(row);
}
function escH(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function fmtSize(b){ return b>1048576?(b/1048576).toFixed(1)+' MB':b>1024?(b/1024).toFixed(0)+' KB':b+' B'; }
function fileIcon(n){ const e=n.split('.').pop().toLowerCase(); return {pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',mp4:'🎬',mp3:'🎵',zip:'🗜️',rar:'🗜️'}[e]||'📎'; }

// ── AI WORD SUGGESTIONS ──
let currentSuggestions=[];
async function fetchAISuggestion(text) {
  if(!text.trim()) return hideSuggestions();
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({
        model:GROQ_MODEL,
        messages:[
          {role:'system',content:'You are a chat autocomplete assistant. Given the start of a message, suggest 3 short next-word or short phrase completions (2-4 words max each). Reply ONLY with a JSON array of 3 strings, no explanation. Example: ["sounds good","let me know","on my way"]'},
          {role:'user',content:`Complete this message: "${text}"`}
        ],
        max_tokens:60
      })
    });
    const json=await res.json();
    let raw=json.choices?.[0]?.message?.content||'[]';
    raw=raw.replace(/```json|```/g,'').trim();
    const suggestions=JSON.parse(raw);
    if(Array.isArray(suggestions)&&suggestions.length) showSuggestions(suggestions, text);
    else hideSuggestions();
  }catch(e){ hideSuggestions(); }
}
function showSuggestions(suggestions, currentText) {
  currentSuggestions=suggestions;
  const bar=document.getElementById('ai-suggest');
  bar.innerHTML='<span class="suggest-label">AI ✦</span>';
  suggestions.slice(0,3).forEach((s,i)=>{
    const chip=document.createElement('button');
    chip.className='suggest-chip';
    chip.textContent=s;
    chip.title='Tab to accept first suggestion';
    chip.onclick=()=>applySuggestion(currentText, s);
    if(i===0) chip.style.borderColor='rgba(108,99,255,.6)';
    bar.appendChild(chip);
  });
  bar.classList.add('show');
}
function hideSuggestions() { document.getElementById('ai-suggest').classList.remove('show'); currentSuggestions=[]; }
function acceptSuggestion() { if(currentSuggestions.length) applySuggestion(document.getElementById('msg-input').value, currentSuggestions[0]); }
function applySuggestion(currentText, suggestion) {
  const inp=document.getElementById('msg-input');
  inp.value=currentText+' '+suggestion;
  inp.focus(); autoResize(inp); hideSuggestions();
  // move cursor to end
  inp.selectionStart=inp.selectionEnd=inp.value.length;
}

// ── CALLS via SUPABASE REALTIME (no database table) ──
// Uses a broadcast channel per user pair.
// Signal types: 'offer', 'answer', 'ice', 'ringing', 'decline', 'hangup'
const ICE_CONF={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let myCallCh=null;
let currentCallType=null;

function subscribeCallChannel() {
  // Listen on my personal channel for incoming signals
  myCallCh=sb.channel(`call:${myProfile.id}`)
    .on('broadcast',{event:'ringing'},async p=>handleIncomingRing(p.payload))
    .on('broadcast',{event:'answer'}, p=>handleAnswer(p.payload))
    .on('broadcast',{event:'ice'},    p=>handleRemoteICE(p.payload))
    .on('broadcast',{event:'decline'},p=>handleDecline(p.payload))
    .on('broadcast',{event:'hangup'}, p=>handleHangup(p.payload))
    .subscribe();
}

function getFriendChannel(friendId) {
  return sb.channel(`call:${friendId}`);
}

async function startCall(type) {
  if(!activeFriend) return;
  if(activeCall) return showToast('Already in a call');
  currentCallType=type;
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'}); }
  catch(e){ return showToast('Cannot access mic/camera'); }
  peerConn=new RTCPeerConnection(ICE_CONF);
  localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));
  if(type==='video') document.getElementById('local-video').srcObject=localStream;
  peerConn.onicecandidate=e=>{
    if(e.candidate){
      getFriendChannel(activeFriend.id).send({type:'broadcast',event:'ice',payload:{candidate:e.candidate,from:myProfile.id}});
    }
  };
  peerConn.ontrack=e=>{
    if(type==='video') document.getElementById('remote-video').srcObject=e.streams[0];
  };
  peerConn.onconnectionstatechange=()=>{
    if(peerConn?.connectionState==='connected'){
      document.getElementById('vid-status').textContent='Connected';
      startCallTimer();
    }
  };
  const offer=await peerConn.createOffer();
  await peerConn.setLocalDescription(offer);
  // Send ringing signal to friend
  await getFriendChannel(activeFriend.id).subscribe();
  getFriendChannel(activeFriend.id).send({
    type:'broadcast',event:'ringing',
    payload:{from:myProfile.id,fromName:myProfile.display_name||myProfile.username,callType:type,offer:JSON.stringify(offer)}
  });
  // Show outgoing notification
  activeCall={id:Date.now(),type,friendId:activeFriend.id,role:'caller'};
  showOutgoingNotif(type,activeFriend);
}

async function handleIncomingRing(payload) {
  if(payload.from===myProfile.id) return;
  // Store offer for accept
  incomingCallData={...payload};
  const name=payload.fromName;
  document.getElementById('inc-av').textContent=name[0].toUpperCase();
  document.getElementById('inc-name').textContent=name;
  document.getElementById('inc-type').textContent=payload.callType==='video'?'📹 Video Call':'📞 Audio Call';
  document.getElementById('incoming-notif').classList.add('show');
}

async function acceptCall() {
  document.getElementById('incoming-notif').classList.remove('show');
  if(!incomingCallData) return;
  const {from,fromName,callType,offer}=incomingCallData;
  currentCallType=callType;
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:callType==='video'}); }
  catch(e){ return showToast('Cannot access mic/camera'); }
  peerConn=new RTCPeerConnection(ICE_CONF);
  localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));
  if(callType==='video'){
    document.getElementById('local-video').srcObject=localStream;
    document.getElementById('video-overlay').classList.add('show');
    document.getElementById('vid-call-name').textContent=fromName;
    document.getElementById('vid-status').textContent='Connecting...';
  }
  peerConn.onicecandidate=e=>{
    if(e.candidate) getFriendChannel(from).send({type:'broadcast',event:'ice',payload:{candidate:e.candidate,from:myProfile.id}});
  };
  peerConn.ontrack=e=>{
    if(callType==='video') document.getElementById('remote-video').srcObject=e.streams[0];
  };
  peerConn.onconnectionstatechange=()=>{
    if(peerConn?.connectionState==='connected'){
      document.getElementById('vid-status').textContent='Connected';
      if(callType!=='video') showToast(`📞 Connected with ${fromName}`);
      startCallTimer();
    }
  };
  await peerConn.setRemoteDescription(JSON.parse(offer));
  const answer=await peerConn.createAnswer();
  await peerConn.setLocalDescription(answer);
  const fc=getFriendChannel(from);
  await fc.subscribe();
  fc.send({type:'broadcast',event:'answer',payload:{answer:JSON.stringify(answer),from:myProfile.id}});
  activeCall={id:Date.now(),type:callType,friendId:from,role:'callee',friendName:fromName};
  incomingCallData=null;
  if(callType==='audio') showToast(`📞 Call connected with ${fromName}`);
}

async function handleAnswer(payload) {
  if(!peerConn) return;
  await peerConn.setRemoteDescription(JSON.parse(payload.answer));
  // show video overlay for caller too if video
  if(currentCallType==='video'&&activeFriend){
    document.getElementById('video-overlay').classList.add('show');
    document.getElementById('vid-call-name').textContent=activeFriend.display_name||activeFriend.username;
    document.getElementById('vid-status').textContent='Connecting...';
  }
  hideOutgoingNotif();
}

async function handleRemoteICE(payload) {
  if(!peerConn||!payload.candidate) return;
  try{ await peerConn.addIceCandidate(new RTCIceCandidate(payload.candidate)); }catch(e){}
}

function handleDecline(payload) {
  hideOutgoingNotif();
  document.getElementById('incoming-notif').classList.remove('show');
  showToast('📵 Call declined');
  cleanupCall();
}
function handleHangup(payload) {
  showToast('📵 Call ended');
  if(activeCall&&activeFriend){
    const dur=callSeconds;
    sb.from('messages').insert({sender_id:myProfile.id,sent_to:activeFriend.id,content:`${currentCallType==='video'?'Video':'Voice'} call · ${dur>0?fmtDur(dur):'Missed'}`,type:'call'});
  }
  cleanupCall();
}

function showOutgoingNotif(type,friend) {
  document.getElementById('out-av').textContent=(friend.display_name||friend.username)[0].toUpperCase();
  document.getElementById('out-name').textContent=friend.display_name||friend.username;
  document.getElementById('out-sub').textContent=type==='video'?'📹 Video Call…':'📞 Calling…';
  document.getElementById('outgoing-notif').classList.add('show');
}
function hideOutgoingNotif(){ document.getElementById('outgoing-notif').classList.remove('show'); }

async function cancelCall() {
  if(activeFriend) getFriendChannel(activeFriend.id).send({type:'broadcast',event:'hangup',payload:{from:myProfile.id}});
  hideOutgoingNotif();
  cleanupCall();
}
async function declineCall() {
  document.getElementById('incoming-notif').classList.remove('show');
  if(incomingCallData) getFriendChannel(incomingCallData.from).send({type:'broadcast',event:'decline',payload:{from:myProfile.id}});
  incomingCallData=null;
}
async function endCall() {
  const dur=callSeconds;
  if(activeCall&&activeFriend){
    getFriendChannel(activeCall.friendId).send({type:'broadcast',event:'hangup',payload:{from:myProfile.id}});
    await sb.from('messages').insert({sender_id:myProfile.id,sent_to:activeFriend.id,content:`${currentCallType==='video'?'Video':'Voice'} call · ${dur>0?fmtDur(dur):'No answer'}`,type:'call'});
  }
  cleanupCall();
}
function cleanupCall(){
  clearInterval(callTimerInterval); callSeconds=0;
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(peerConn){ peerConn.close(); peerConn=null; }
  document.getElementById('video-overlay').classList.remove('show');
  document.getElementById('remote-video').srcObject=null;
  document.getElementById('local-video').srcObject=null;
  hideOutgoingNotif();
  document.getElementById('incoming-notif').classList.remove('show');
  activeCall=null; isMuted=false; isCameraOff=false; currentCallType=null;
}
function startCallTimer(){
  callSeconds=0;
  callTimerInterval=setInterval(()=>{
    callSeconds++;
    const m=Math.floor(callSeconds/60),s=callSeconds%60;
    document.getElementById('vid-status').textContent=`${m}:${s.toString().padStart(2,'0')}`;
  },1000);
}
function toggleMute(){ isMuted=!isMuted; if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); document.getElementById('vid-mute-btn').textContent=isMuted?'🔇':'🎤'; }
function toggleCamera(){ isCameraOff=!isCameraOff; if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=!isCameraOff); }
function fmtDur(s){ const m=Math.floor(s/60),sec=s%60; return m>0?`${m}m ${sec}s`:`${sec}s`; }
function showToast(msg){ const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),3000); }

// INIT
sb.auth.getSession().then(({data})=>{ if(data.session?.user) onAuth(data.session.user); });
document.getElementById('add-friend-modal').addEventListener('click',function(e){ if(e.target===this) closeAddFriendModal(); });
document.getElementById('ai-overlay').addEventListener('click',function(e){ if(e.target===this) toggleAI(); });
document.addEventListener('click',e=>{ if(!e.target.closest('#emoji-picker')&&!e.target.closest('.emoji-btn')) closeEmojiPicker(); });
</script>
</body>
</html>
