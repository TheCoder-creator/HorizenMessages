<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HorizenMessages</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/plugin/relativeTime.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #18181f;
    --bg4: #222230;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --accent3: #38bdf8;
    --green: #22d3a0;
    --red: #f43f5e;
    --yellow: #fbbf24;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a72;
    --sidebar: 300px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; font-size: 14px; }
  h1,h2,h3 { font-family: 'Syne', sans-serif; }

  /* AUTH */
  #auth-screen {
    display: flex; align-items: center; justify-content: center; height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, #1a1040 0%, var(--bg) 60%),
                radial-gradient(ellipse at 80% 80%, #0a1a30 0%, transparent 60%);
  }
  .auth-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 48px 44px; width: 420px; box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.1); }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), var(--accent3)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent2); }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
  .auth-tab { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text2); border-radius: 7px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 13px; transition: all 0.2s; }
  .auth-tab.active { background: var(--accent); color: white; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; }
  .form-group input { width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }
  .btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border: none; border-radius: 10px; color: white; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.3px; }
  .btn-primary:hover { opacity: 0.88; }
  .auth-error { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); border-radius: 8px; padding: 10px 14px; color: var(--red); font-size: 13px; margin-bottom: 16px; display: none; }

  /* APP LAYOUT */
  #app { display: none; height: 100vh; flex-direction: row; }
  #app.show { display: flex; }

  /* NAV TABS (left of sidebar) */
  .nav-rail {
    width: 60px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 0; gap: 4px; flex-shrink: 0;
  }
  .nav-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent3)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 16px; }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 12px; border: none;
    background: transparent; color: var(--text3); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: all 0.2s; position: relative;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--text2); }
  .nav-btn.active { background: rgba(108,99,255,0.15); color: var(--accent2); }
  .nav-btn .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; border: 2px solid var(--bg2); }
  .nav-spacer { flex: 1; }
  .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent3)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }

  /* SIDEBAR PANELS */
  .sidebar { width: var(--sidebar); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .panel.active { display: flex; }
  .panel-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; }
  .search-box { padding: 10px 12px; }
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; padding: 8px 12px 8px 32px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }
  .list-scroll { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .list-scroll::-webkit-scrollbar { width: 3px; }
  .list-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .section-label { padding: 6px 8px 2px; font-size: 10px; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; font-family: 'Syne', sans-serif; font-weight: 600; }

  /* GROUP ITEMS */
  .conv-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
  .conv-item:hover { background: var(--bg3); }
  .conv-item.active { background: rgba(108,99,255,0.15); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent3)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; flex-shrink: 0; position: relative; }
  .avatar.sm { width: 32px; height: 32px; font-size: 12px; }
  .avatar.xs { width: 26px; height: 26px; font-size: 10px; }
  .status-dot { position: absolute; bottom: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--text3); border: 2px solid var(--bg2); }
  .status-dot.online { background: var(--green); }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-weight: 600; font-size: 13px; font-family: 'Syne', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .conv-meta { text-align: right; flex-shrink: 0; }
  .conv-time { color: var(--text3); font-size: 10px; }

  /* FRIEND ITEMS */
  .friend-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; }
  .friend-item.clickable { cursor: pointer; transition: background 0.15s; }
  .friend-item.clickable:hover { background: var(--bg3); }
  .friend-info { flex: 1; min-width: 0; }
  .friend-name { font-weight: 600; font-size: 13px; font-family: 'Syne', sans-serif; }
  .friend-status { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .friend-status.online { color: var(--green); }
  .friend-actions { display: flex; gap: 4px; }
  .friend-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
  .friend-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .friend-btn.accept:hover { border-color: var(--green); color: var(--green); }
  .friend-btn.decline:hover { border-color: var(--red); color: var(--red); }

  /* MAIN CHAT */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--bg2); }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
  .chat-header-status { color: var(--text2); font-size: 11px; margin-top: 1px; }
  .chat-header-actions { display: flex; gap: 6px; }
  .call-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; }
  .call-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .call-btn.video:hover { background: var(--accent3); border-color: var(--accent3); color: var(--bg); }

  /* MESSAGES */
  .messages-container { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 3px; background: var(--bg); }
  .messages-container::-webkit-scrollbar { width: 4px; }
  .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-avatar { flex-shrink: 0; }
  .msg-row.mine .msg-avatar { display: none; }
  .msg-bubble { max-width: 68%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
  .msg-bubble.theirs { background: var(--bg3); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  .msg-bubble.mine { background: linear-gradient(135deg, var(--accent), #7c3aed); border-bottom-right-radius: 4px; color: white; margin-left: auto; }
  .msg-bubble.call-event { background: rgba(108,99,255,0.08); border: 1px solid rgba(108,99,255,0.2); color: var(--text2); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .msg-time { font-size: 10px; color: var(--text3); padding: 0 4px; flex-shrink: 0; align-self: flex-end; margin-bottom: 2px; }
  .day-divider { text-align: center; color: var(--text3); font-size: 11px; letter-spacing: 1px; margin: 10px 0; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
  .day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* INPUT */
  .chat-input-area { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg2); }
  .input-row { display: flex; align-items: flex-end; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 16px; padding: 9px 12px; transition: border-color 0.2s; }
  .input-row:focus-within { border-color: var(--accent); }
  #msg-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; max-height: 120px; line-height: 1.5; }
  #msg-input::placeholder { color: var(--text3); }
  .send-btn { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), #7c3aed); border: none; border-radius: 9px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; transition: opacity 0.2s; }
  .send-btn:hover { opacity: 0.85; }

  /* EMPTY STATE */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 12px; }
  .empty-state .empty-icon { font-size: 52px; }
  .empty-state h3 { font-family: 'Syne', sans-serif; color: var(--text2); font-size: 18px; }

  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 400px; box-shadow: 0 40px 80px rgba(0,0,0,0.5); }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .user-search-results { max-height: 200px; overflow-y: auto; margin-top: 8px; }
  .user-result { display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 10px; cursor: pointer; transition: background 0.15s; justify-content: space-between; }
  .user-result:hover { background: var(--bg3); }
  .user-result-left { display: flex; align-items: center; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-secondary { flex: 1; padding: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Syne', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-small { padding: 5px 12px; border-radius: 8px; border: none; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 11px; cursor: pointer; transition: opacity 0.2s; }
  .btn-small:hover { opacity: 0.8; }
  .btn-small.add { background: var(--accent); color: white; }
  .btn-small.pending { background: var(--bg4); color: var(--text3); cursor: default; }

  /* CALL OVERLAY */
  #call-overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; background: radial-gradient(ellipse at center, #1a1040 0%, #0a0a0f 70%); }
  #call-overlay.show { display: flex; }
  .call-avatar-big { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent3)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 44px; margin-bottom: 22px; animation: pulse-ring 2s infinite; }
  @keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.4), 0 0 60px rgba(108,99,255,0.3); } 50% { box-shadow: 0 0 0 20px rgba(108,99,255,0), 0 0 80px rgba(108,99,255,0.5); } }
  .call-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; margin-bottom: 8px; }
  .call-status { color: var(--text2); font-size: 14px; margin-bottom: 44px; }
  .call-controls { display: flex; gap: 18px; align-items: center; }
  .call-ctrl-btn { width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 21px; transition: all 0.2s; }
  .call-ctrl-btn.mute { background: var(--bg3); color: var(--text); }
  .call-ctrl-btn.end { background: var(--red); color: white; width: 66px; height: 66px; font-size: 23px; }
  .call-ctrl-btn.end:hover { background: #e11d48; }
  .call-ctrl-btn.vid { background: var(--bg3); color: var(--text); }
  .call-timer { color: var(--text2); font-size: 15px; font-family: 'Syne', sans-serif; margin-bottom: 14px; }
  #video-overlay { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 2000; }
  #video-overlay.show { display: flex; }
  #remote-video { width: 100%; height: 100%; object-fit: cover; background: #111; }
  #local-video { position: absolute; bottom: 120px; right: 20px; width: 150px; height: 95px; border-radius: 12px; object-fit: cover; border: 2px solid var(--border); background: #222; }
  .video-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; display: flex; justify-content: center; gap: 14px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
  .video-info { position: absolute; top: 18px; left: 18px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

  /* INCOMING CALL */
  #incoming-call { position: fixed; top: 18px; right: 18px; background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 18px 22px; width: 290px; display: none; z-index: 3000; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  #incoming-call.show { display: block; }
  .incoming-title { color: var(--text2); font-size: 11px; margin-bottom: 6px; letter-spacing: 1px; }
  .incoming-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; margin-bottom: 3px; }
  .incoming-type { color: var(--text2); font-size: 12px; margin-bottom: 14px; }
  .incoming-btns { display: flex; gap: 8px; }
  .btn-accept { flex: 1; padding: 10px; background: var(--green); border: none; border-radius: 10px; color: var(--bg); font-weight: 700; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 12px; }
  .btn-decline { flex: 1; padding: 10px; background: var(--red); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 12px; }

  /* ICON BTN */
  .icon-btn { width: 30px; height: 30px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 15px; transition: all 0.2s; }
  .icon-btn:hover { color: var(--accent2); border-color: var(--accent); }

  /* TOAST */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 11px 18px; font-size: 13px; color: var(--text); opacity: 0; transition: opacity 0.3s; z-index: 4000; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* FRIEND REQUEST INDICATOR */
  .req-count { background: var(--red); color: white; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 700; margin-left: 6px; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>Horizen<span>Messages</span></h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div id="login-form">
      <div class="form-group"><label>EMAIL</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="form-group"><label>PASSWORD</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    </div>
    <div id="signup-form" style="display:none">
      <div class="form-group"><label>USERNAME</label><input type="text" id="signup-username" placeholder="yourname"></div>
      <div class="form-group"><label>EMAIL</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="form-group"><label>PASSWORD</label><input type="password" id="signup-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doSignup()"></div>
      <button class="btn-primary" onclick="doSignup()">Create Account →</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Nav Rail -->
  <div class="nav-rail">
    <div class="nav-logo">💬</div>
    <button class="nav-btn active" id="nav-groups" onclick="switchPanel('groups')" title="Groups">💬</button>
    <button class="nav-btn" id="nav-friends" onclick="switchPanel('friends')" title="Friends">
      👥
      <span class="badge" id="friend-req-badge" style="display:none"></span>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" onclick="doLogout()" title="Sign out" style="font-size:16px">🚪</button>
    <div class="nav-avatar" id="my-avatar" title="My profile">?</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- GROUPS PANEL -->
    <div class="panel active" id="panel-groups">
      <div class="panel-header">
        <div class="panel-title">Groups</div>
        <button class="icon-btn" onclick="showNewGroupModal()" title="New group">✏️</button>
      </div>
      <div class="search-box">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="group-search" placeholder="Search groups..." oninput="filterGroups()">
        </div>
      </div>
      <div class="list-scroll" id="group-list">
        <div style="padding:20px;color:var(--text3);text-align:center;font-size:13px">Loading...</div>
      </div>
    </div>

    <!-- FRIENDS PANEL -->
    <div class="panel" id="panel-friends">
      <div class="panel-header">
        <div class="panel-title">Friends <span id="req-count-label"></span></div>
        <button class="icon-btn" onclick="showAddFriendModal()" title="Add friend">➕</button>
      </div>
      <div class="search-box">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="friend-search" placeholder="Search friends..." oninput="filterFriends()">
        </div>
      </div>
      <div class="list-scroll" id="friend-list">
        <div style="padding:20px;color:var(--text3);text-align:center;font-size:13px">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
dayjs.extend(dayjs_plugin_relativeTime);

const SUPABASE_URL = 'https://eekwlctegngxdzannddi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YhaRLUgoEVB6iFTMJRwwEw_Bi7v-Qnq';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// STATE
let currentUser = null, currentProfile = null;
let conversations = [], friends = [], pendingRequests = [];
let activeConvId = null, activeConvPartner = null, messages = [];
let msgSub = null, callSub = null, friendSub = null;
let activeCall = null, localStream = null, remoteStream = null, peerConn = null;
let callTimerInterval = null, callSeconds = 0, isMuted = false, isCameraOff = false;
let incomingCallData = null;

// ===== AUTH =====
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
}
function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return showAuthError('Please fill in all fields');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showAuthError(error.message);
  onAuthSuccess(data.user);
}
async function doSignup() {
  const username = document.getElementById('signup-username').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass = document.getElementById('signup-pass').value;
  if (!username || !email || !pass) return showAuthError('Please fill in all fields');
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) return showAuthError(error.message);
  if (data.user) {
    const { error: pe } = await sb.from('profiles').insert({ id: data.user.id, username, display_name: username, status: 'online' });
    if (pe) return showAuthError(pe.message);
    onAuthSuccess(data.user);
  } else { showAuthError('Check your email to confirm your account'); }
}
async function doLogout() {
  if (currentProfile) await sb.from('profiles').update({ status: 'offline', last_seen: new Date().toISOString() }).eq('id', currentProfile.id);
  await sb.auth.signOut();
  location.reload();
}
async function onAuthSuccess(user) {
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!profile) return showAuthError('Profile not found. Please sign up.');
  currentProfile = profile;
  await sb.from('profiles').update({ status: 'online' }).eq('id', user.id);
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('my-avatar').textContent = profile.username[0].toUpperCase();
  loadGroups();
  loadFriends();
  subscribeToCallEvents();
  subscribeFriendEvents();
}

// ===== PANEL NAV =====
function switchPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
}

// ===== GROUPS =====
async function loadGroups() {
  const { data: memberships } = await sb.from('conversation_members').select('conversation_id').eq('user_id', currentProfile.id);
  if (!memberships?.length) {
    document.getElementById('group-list').innerHTML = '<div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">No groups yet.<br>Click ✏️ to start one!</div>';
    return;
  }
  const convIds = memberships.map(m => m.conversation_id);
  const { data: convs } = await sb.from('conversations').select('*').in('id', convIds).order('created_at', { ascending: false });
  conversations = convs || [];
  renderGroups();
}

async function renderGroups() {
  const listEl = document.getElementById('group-list');
  if (!conversations.length) {
    listEl.innerHTML = '<div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">No groups yet.<br>Click ✏️ to start one!</div>';
    return;
  }
  listEl.innerHTML = '';
  for (const conv of conversations) {
    const { data: members } = await sb.from('conversation_members').select('user_id').eq('conversation_id', conv.id);
    const otherId = members?.find(m => m.user_id !== currentProfile.id)?.user_id;
    if (!otherId) continue;
    const { data: partner } = await sb.from('profiles').select('*').eq('id', otherId).single();
    if (!partner) continue;
    const { data: lastMsgs } = await sb.from('messages').select('*').eq('conversation_id', conv.id).order('created_at', { ascending: false }).limit(1);
    const lastMsg = lastMsgs?.[0];
    const item = document.createElement('div');
    item.className = `conv-item${activeConvId === conv.id ? ' active' : ''}`;
    item.dataset.convId = conv.id;
    item.onclick = () => openGroup(conv.id, partner);
    const isOnline = partner.status === 'online';
    const initials = (partner.display_name || partner.username)[0].toUpperCase();
    item.innerHTML = `
      <div class="avatar">${initials}<div class="status-dot ${isOnline ? 'online' : ''}"></div></div>
      <div class="conv-info">
        <div class="conv-name">${partner.display_name || partner.username}</div>
        <div class="conv-preview">${lastMsg ? (lastMsg.type === 'call' ? '📞 Call' : lastMsg.content.substring(0, 38)) : 'No messages yet'}</div>
      </div>
      <div class="conv-meta"><div class="conv-time">${lastMsg ? dayjs(lastMsg.created_at).fromNow(true) : ''}</div></div>
    `;
    listEl.appendChild(item);
  }
}

function filterGroups() {
  const q = document.getElementById('group-search').value.toLowerCase();
  document.querySelectorAll('#group-list .conv-item').forEach(el => {
    el.style.display = el.querySelector('.conv-name').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

async function openGroup(convId, partner) {
  activeConvId = convId;
  activeConvPartner = partner;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('active-chat').style.display = 'flex';
  document.getElementById('chat-avatar').textContent = (partner.display_name || partner.username)[0].toUpperCase();
  document.getElementById('chat-name').textContent = partner.display_name || partner.username;
  document.getElementById('chat-status').textContent = partner.status === 'online' ? '● Online' : `Last seen ${dayjs(partner.last_seen).fromNow()}`;
  document.querySelectorAll('.conv-item').forEach(el => el.classList.toggle('active', el.dataset.convId === convId));
  if (msgSub) msgSub.unsubscribe();
  await loadMessages(convId);
  msgSub = sb.channel(`msgs:${convId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convId}` }, p => appendMessage(p.new))
    .subscribe();
}

async function loadMessages(convId) {
  const { data } = await sb.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true });
  messages = data || [];
  renderMessages();
}

function renderMessages() {
  const c = document.getElementById('messages-container');
  c.innerHTML = '';
  let lastDate = null;
  for (const msg of messages) {
    const d = dayjs(msg.created_at).format('MMMM D, YYYY');
    if (d !== lastDate) {
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = d;
      c.appendChild(div);
      lastDate = d;
    }
    renderSingleMessage(msg, c);
  }
  c.scrollTop = c.scrollHeight;
}

function appendMessage(msg) {
  messages.push(msg);
  const c = document.getElementById('messages-container');
  renderSingleMessage(msg, c);
  c.scrollTop = c.scrollHeight;
  renderGroups();
}

function renderSingleMessage(msg, container) {
  const isMine = msg.sender_id === currentProfile.id;
  const row = document.createElement('div');
  row.className = `msg-row ${isMine ? 'mine' : ''}`;
  if (msg.type === 'call') {
    row.innerHTML = `<div class="msg-bubble call-event" style="${isMine ? 'margin-left:auto' : ''}">📞 ${msg.content}</div><div class="msg-time">${dayjs(msg.created_at).format('h:mm A')}</div>`;
  } else if (!isMine) {
    const initials = activeConvPartner ? (activeConvPartner.display_name || activeConvPartner.username)[0].toUpperCase() : '?';
    row.innerHTML = `<div class="avatar xs msg-avatar">${initials}</div><div class="msg-bubble theirs">${escHtml(msg.content)}</div><div class="msg-time">${dayjs(msg.created_at).format('h:mm A')}</div>`;
  } else {
    row.innerHTML = `<div class="msg-time">${dayjs(msg.created_at).format('h:mm A')}</div><div class="msg-bubble mine">${escHtml(msg.content)}</div>`;
  }
  container.appendChild(row);
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !activeConvId) return;
  input.value = ''; input.style.height = '';
  await sb.from('messages').insert({ conversation_id: activeConvId, sender_id: currentProfile.id, content, type: 'text' });
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// NEW GROUP MODAL
function showNewGroupModal() {
  document.getElementById('new-group-modal').classList.add('show');
  document.getElementById('group-user-results').innerHTML = '';
  document.getElementById('group-user-search').value = '';
}
function closeNewGroupModal() { document.getElementById('new-group-modal').classList.remove('show'); }

async function searchUsersForGroup() {
  const q = document.getElementById('group-user-search').value.trim();
  const res = document.getElementById('group-user-results');
  if (q.length < 2) { res.innerHTML = ''; return; }
  const { data } = await sb.from('profiles').select('*').ilike('username', `%${q}%`).neq('id', currentProfile.id).limit(8);
  res.innerHTML = '';
  (data || []).forEach(user => {
    const el = document.createElement('div');
    el.className = 'user-result';
    el.innerHTML = `<div class="user-result-left"><div class="avatar xs">${user.username[0].toUpperCase()}</div><div><div style="font-weight:600;font-size:13px;font-family:'Syne',sans-serif">${user.display_name || user.username}</div><div style="color:var(--text2);font-size:11px">@${user.username}</div></div></div>`;
    el.onclick = () => startGroup(user);
    res.appendChild(el);
  });
  if (!data?.length) res.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:10px">No users found</div>';
}

async function startGroup(partner) {
  try {
    const { data: myMemberships } = await sb
      .from('conversation_members')
      .select('conversation_id')
      .eq('user_id', currentProfile.id);

    const convIds = (myMemberships || []).map(m => m.conversation_id);

    let existingConv = null;

    for (const convId of convIds) {
      const { data: members } = await sb
        .from('conversation_members')
        .select('user_id')
        .eq('conversation_id', convId);

      if (
        members &&
        members.length === 2 &&
        members.some(m => m.user_id === currentProfile.id) &&
        members.some(m => m.user_id === partner.id)
      ) {
        existingConv = convId;
        break;
      }
    }

    if (existingConv) {
      closeNewGroupModal();
      await loadGroups();
      return openGroup(existingConv, partner);
    }

    const { data: conv, error } = await sb
      .from('conversations')
      .insert({
        type: 'direct',
        created_by: (await sb.auth.getUser()).data.user.id
      })
      .select()
      .single();

    if (error) {
      showToast(error.message);
      return;
    }

    await sb.from('conversation_members').insert([
      {
        conversation_id: conv.id,
        user_id: currentProfile.id
      },
      {
        conversation_id: conv.id,
        user_id: partner.id
      }
    ]);

    closeNewGroupModal();

    await loadGroups();

    openGroup(conv.id, partner);

    showToast('Conversation created!');
  } catch (err) {
    console.error(err);
    showToast('Failed to create conversation');
  }
}

// ===== FRIENDS =====
async function loadFriends() {
  // Accepted friends
  const { data: accepted } = await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*), addressee:profiles!friendships_addressee_id_fkey(*)')
    .or(`requester_id.eq.${currentProfile.id},addressee_id.eq.${currentProfile.id}`)
    .eq('status', 'accepted');
  friends = (accepted || []).map(f => f.requester_id === currentProfile.id ? f.addressee : f.requester);

  // Pending requests TO me
  const { data: pending } = await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*)')
    .eq('addressee_id', currentProfile.id)
    .eq('status', 'pending');
  pendingRequests = pending || [];

  renderFriends();
  updateFriendBadge();
}

function updateFriendBadge() {
  const badge = document.getElementById('friend-req-badge');
  const label = document.getElementById('req-count-label');
  if (pendingRequests.length > 0) {
    badge.style.display = 'block';
    label.innerHTML = `<span class="req-count">${pendingRequests.length}</span>`;
  } else {
    badge.style.display = 'none';
    label.innerHTML = '';
  }
}

function renderFriends() {
  const listEl = document.getElementById('friend-list');
  listEl.innerHTML = '';

  if (pendingRequests.length) {
    const sec = document.createElement('div');
    sec.className = 'section-label';
    sec.textContent = `Requests (${pendingRequests.length})`;
    listEl.appendChild(sec);
    pendingRequests.forEach(req => {
      const el = document.createElement('div');
      el.className = 'friend-item';
      el.innerHTML = `
        <div class="avatar xs">${req.requester.username[0].toUpperCase()}</div>
        <div class="friend-info">
          <div class="friend-name">${req.requester.display_name || req.requester.username}</div>
          <div class="friend-status">Wants to be friends</div>
        </div>
        <div class="friend-actions">
          <button class="friend-btn accept" onclick="acceptFriend('${req.id}')" title="Accept">✓</button>
          <button class="friend-btn decline" onclick="declineFriend('${req.id}')" title="Decline">✕</button>
        </div>
      `;
      listEl.appendChild(el);
    });
  }

  if (friends.length) {
    const sec = document.createElement('div');
    sec.className = 'section-label';
    sec.textContent = `Friends (${friends.length})`;
    listEl.appendChild(sec);
    friends.forEach(friend => {
      const el = document.createElement('div');
      el.className = 'friend-item clickable';
      el.onclick = () => messageFromFriend(friend);
      const isOnline = friend.status === 'online';
      el.innerHTML = `
        <div class="avatar xs">${friend.username[0].toUpperCase()}<div class="status-dot ${isOnline ? 'online' : ''}"></div></div>
        <div class="friend-info">
          <div class="friend-name">${friend.display_name || friend.username}</div>
          <div class="friend-status ${isOnline ? 'online' : ''}">${isOnline ? '● Online' : `Last seen ${dayjs(friend.last_seen).fromNow()}`}</div>
        </div>
        <div class="friend-actions">
          <button class="friend-btn" onclick="event.stopPropagation();messageFromFriend(${JSON.stringify(friend).replace(/"/g,'&quot;')})" title="Message">💬</button>
        </div>
      `;
      listEl.appendChild(el);
    });
  }

  if (!friends.length && !pendingRequests.length) {
    listEl.innerHTML = '<div style="padding:20px;color:var(--text3);text-align:center;font-size:13px">No friends yet.<br>Click ➕ to add someone!</div>';
  }
}

function filterFriends() {
  const q = document.getElementById('friend-search').value.toLowerCase();
  document.querySelectorAll('#friend-list .friend-item').forEach(el => {
    const name = el.querySelector('.friend-name')?.textContent.toLowerCase() || '';
    el.style.display = name.includes(q) ? '' : 'none';
  });
}

async function messageFromFriend(friend) {
  switchPanel('groups');

  try {
    await startGroup(friend);
  } catch (err) {
    console.error(err);
    showToast('Could not open conversation');
  }
}

// ADD FRIEND MODAL
function showAddFriendModal() {
  document.getElementById('add-friend-modal').classList.add('show');
  document.getElementById('friend-user-results').innerHTML = '';
  document.getElementById('friend-user-search').value = '';
}
function closeAddFriendModal() { document.getElementById('add-friend-modal').classList.remove('show'); }

async function searchUsersForFriend() {
  const q = document.getElementById('friend-user-search').value.trim();
  const res = document.getElementById('friend-user-results');
  if (q.length < 2) { res.innerHTML = ''; return; }
  const { data } = await sb.from('profiles').select('*').ilike('username', `%${q}%`).neq('id', currentProfile.id).limit(8);
  res.innerHTML = '';
  // Get existing friend/request ids
  const { data: existing } = await sb.from('friendships')
    .select('*')
    .or(`requester_id.eq.${currentProfile.id},addressee_id.eq.${currentProfile.id}`);
  const existingMap = {};
  (existing || []).forEach(f => {
    const otherId = f.requester_id === currentProfile.id ? f.addressee_id : f.requester_id;
    existingMap[otherId] = f.status;
  });
  (data || []).forEach(user => {
    const status = existingMap[user.id];
    const el = document.createElement('div');
    el.className = 'user-result';
    let actionBtn = '';
    if (status === 'accepted') actionBtn = `<span class="btn-small pending">Friends ✓</span>`;
    else if (status === 'pending') actionBtn = `<span class="btn-small pending">Pending…</span>`;
    else actionBtn = `<button class="btn-small add" onclick="sendFriendRequest('${user.id}', this)">Add Friend</button>`;
    el.innerHTML = `<div class="user-result-left"><div class="avatar xs">${user.username[0].toUpperCase()}</div><div><div style="font-weight:600;font-size:13px;font-family:'Syne',sans-serif">${user.display_name || user.username}</div><div style="color:var(--text2);font-size:11px">@${user.username}</div></div></div>${actionBtn}`;
    res.appendChild(el);
  });
  if (!data?.length) res.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:10px">No users found</div>';
}

async function sendFriendRequest(addresseeId, btn) {
  const { error } = await sb.from('friendships').insert({ requester_id: currentProfile.id, addressee_id: addresseeId, status: 'pending' });
  if (error) return showToast(error.message);
  btn.textContent = 'Pending…';
  btn.className = 'btn-small pending';
  btn.disabled = true;
  showToast('Friend request sent!');
}

async function acceptFriend(friendshipId) {
  await sb.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
  await loadFriends();
  showToast('Friend added!');
}

async function declineFriend(friendshipId) {
  await sb.from('friendships').delete().eq('id', friendshipId);
  await loadFriends();
}

function subscribeFriendEvents() {
  friendSub = sb.channel(`friends:${currentProfile.id}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => loadFriends())
    .subscribe();
}

// ===== CALLS (WebRTC) =====
const ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

function subscribeToCallEvents() {
  callSub = sb.channel(`calls:${currentProfile.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls' }, async p => {
      const call = p.new;
      if (call.caller_id !== currentProfile.id) {
        const { data: caller } = await sb.from('profiles').select('*').eq('id', call.caller_id).single();
        if (caller) showIncomingCall(call, caller);
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls' }, p => handleCallUpdate(p.new))
    .subscribe();
}

async function startCall(type) {
  if (!activeConvId || !activeConvPartner) return;
  if (activeCall) return showToast('Already in a call');
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' }); }
  catch(e) { return showToast('Could not access microphone/camera'); }
  peerConn = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
  if (type === 'video') document.getElementById('local-video').srcObject = localStream;
  peerConn.onicecandidate = async (e) => {
    if (e.candidate && activeCall) {
      const { data: curr } = await sb.from('calls').select('ice_candidates').eq('id', activeCall.id).single();
      const cands = curr?.ice_candidates || [];
      cands.push({ side: 'caller', candidate: e.candidate });
      await sb.from('calls').update({ ice_candidates: cands }).eq('id', activeCall.id);
    }
  };
  peerConn.ontrack = (e) => {
    remoteStream = e.streams[0];
    if (type === 'video') document.getElementById('remote-video').srcObject = remoteStream;
  };
  const offer = await peerConn.createOffer();
  await peerConn.setLocalDescription(offer);
  const { data: call } = await sb.from('calls').insert({ conversation_id: activeConvId, caller_id: currentProfile.id, type, status: 'ringing', offer: JSON.stringify(offer) }).select().single();
  activeCall = call;
  showCallUI(type, activeConvPartner, 'Calling...');
}

async function handleCallUpdate(call) {
  if (!activeCall || call.id !== activeCall.id) return;
  activeCall = call;
  if (call.status === 'active' && call.answer && peerConn && peerConn.signalingState !== 'stable') {
    try {
      await peerConn.setRemoteDescription(JSON.parse(call.answer));
      document.getElementById('call-status-text').textContent = 'Connected';
      startCallTimer();
      (call.ice_candidates || []).forEach(async ic => {
        if (ic.side === 'callee') try { await peerConn.addIceCandidate(new RTCIceCandidate(ic.candidate)); } catch(e){}
      });
    } catch(e) {}
  }
  if (call.status === 'ended') cleanupCall();
}

function showIncomingCall(call, caller) {
  incomingCallData = { call, caller };
  document.getElementById('incoming-name').textContent = caller.display_name || caller.username;
  document.getElementById('incoming-type').textContent = call.type === 'video' ? '📹 Video Call' : '📞 Audio Call';
  document.getElementById('incoming-call').classList.add('show');
}

async function acceptCall() {
  document.getElementById('incoming-call').classList.remove('show');
  if (!incomingCallData) return;
  const { call, caller } = incomingCallData;
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: call.type === 'video' }); }
  catch(e) { return showToast('Could not access microphone/camera'); }
  peerConn = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
  if (call.type === 'video') document.getElementById('local-video').srcObject = localStream;
  peerConn.onicecandidate = async (e) => {
    if (e.candidate) {
      const { data: curr } = await sb.from('calls').select('ice_candidates').eq('id', call.id).single();
      const cands = curr?.ice_candidates || [];
      cands.push({ side: 'callee', candidate: e.candidate });
      await sb.from('calls').update({ ice_candidates: cands }).eq('id', call.id);
    }
  };
  peerConn.ontrack = (e) => {
    remoteStream = e.streams[0];
    if (call.type === 'video') document.getElementById('remote-video').srcObject = remoteStream;
  };
  await peerConn.setRemoteDescription(JSON.parse(call.offer));
  const answer = await peerConn.createAnswer();
  await peerConn.setLocalDescription(answer);
  (call.ice_candidates || []).forEach(async ic => {
    if (ic.side === 'caller') try { await peerConn.addIceCandidate(new RTCIceCandidate(ic.candidate)); } catch(e){}
  });
  await sb.from('calls').update({ status: 'active', answer: JSON.stringify(answer) }).eq('id', call.id);
  activeCall = { ...call, status: 'active' };
  showCallUI(call.type, caller, 'Connected');
  startCallTimer();
  incomingCallData = null;
}

async function declineCall() {
  document.getElementById('incoming-call').classList.remove('show');
  if (incomingCallData) { await sb.from('calls').update({ status: 'missed' }).eq('id', incomingCallData.call.id); incomingCallData = null; }
}

function showCallUI(type, partner, status) {
  const initials = (partner.display_name || partner.username)[0].toUpperCase();
  const name = partner.display_name || partner.username;
  if (type === 'video') {
    document.getElementById('video-overlay').classList.add('show');
    document.getElementById('video-call-name').textContent = name;
  } else {
    document.getElementById('call-overlay').classList.add('show');
    document.getElementById('call-avatar').textContent = initials;
    document.getElementById('call-name').textContent = name;
    document.getElementById('call-status-text').textContent = status;
  }
}

function startCallTimer() {
  callSeconds = 0;
  document.getElementById('call-timer').style.display = 'block';
  document.getElementById('call-status-text').style.display = 'none';
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = Math.floor(callSeconds/60), s = callSeconds%60;
    document.getElementById('call-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

async function endCall() {
  if (activeCall) {
    const duration = callSeconds;
    await sb.from('calls').update({ status: 'ended', ended_at: new Date().toISOString() }).eq('id', activeCall.id);
    if (activeConvId) {
      await sb.from('messages').insert({ conversation_id: activeConvId, sender_id: currentProfile.id, content: `${activeCall.type === 'video' ? 'Video' : 'Voice'} call · ${duration > 0 ? fmtDur(duration) : 'No answer'}`, type: 'call' });
    }
  }
  cleanupCall();
}

function cleanupCall() {
  clearInterval(callTimerInterval); callSeconds = 0;
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (peerConn) { peerConn.close(); peerConn = null; }
  document.getElementById('call-overlay').classList.remove('show');
  document.getElementById('video-overlay').classList.remove('show');
  document.getElementById('call-timer').style.display = 'none';
  document.getElementById('call-status-text').style.display = 'block';
  document.getElementById('call-status-text').textContent = 'Calling...';
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('local-video').srcObject = null;
  activeCall = null; isMuted = false; isCameraOff = false;
}

function toggleMute() {
  isMuted = !isMuted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🎤';
  if (document.getElementById('vid-mute-btn')) document.getElementById('vid-mute-btn').textContent = isMuted ? '🔇' : '🎤';
}
function toggleCamera() { isCameraOff = !isCameraOff; if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff); }
function toggleSpeaker() { showToast('Speaker toggled'); }
function fmtDur(s) { const m = Math.floor(s/60), sec = s%60; return m > 0 ? `${m}m ${sec}s` : `${sec}s`; }
function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }

// INIT
sb.auth.getSession().then(({ data }) => { if (data.session?.user) onAuthSuccess(data.session.user); });
document.getElementById('new-group-modal').addEventListener('click', function(e) { if (e.target === this) closeNewGroupModal(); });
document.getElementById('add-friend-modal').addEventListener('click', function(e) { if (e.target === this) closeAddFriendModal(); });
</script>
