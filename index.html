<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HorizenMessages</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/plugin/relativeTime.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --bg2:#111118; --bg3:#18181f; --bg4:#222230;
  --border:#2a2a3a; --accent:#6c63ff; --accent2:#a78bfa; --accent3:#38bdf8;
  --green:#22d3a0; --red:#f43f5e; --yellow:#fbbf24;
  --text:#e8e8f0; --text2:#9090a8; --text3:#5a5a72;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;}
h1,h2,h3{font-family:'Syne',sans-serif;}

/* ── AUTH ── */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:radial-gradient(ellipse at 30% 20%,#1a1040 0%,var(--bg) 60%),radial-gradient(ellipse at 80% 80%,#0a1a30 0%,transparent 60%);}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:44px;width:410px;box-shadow:0 40px 80px rgba(0,0,0,.5);}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent3));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.logo h1{font-size:21px;font-weight:800;}
.logo span{color:var(--accent2);}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:26px;}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);border-radius:7px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;transition:all .2s;}
.auth-tab.active{background:var(--accent);color:#fff;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;letter-spacing:.5px;}
.fg input{width:100%;padding:11px 15px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--accent);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .2s;}
.btn-primary:hover{opacity:.88;}
.auth-error{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:14px;display:none;}

/* ── APP SHELL ── */
#app{display:none;height:100vh;}
#app.show{display:flex;}

/* ── NAV RAIL ── */
.nav-rail{width:58px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex-shrink:0;}
.nav-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent3));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:14px;}
.nav-btn{width:42px;height:42px;border-radius:11px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;transition:all .2s;position:relative;}
.nav-btn:hover{background:var(--bg3);color:var(--text2);}
.nav-btn.active{background:rgba(108,99,255,.15);color:var(--accent2);}
.nav-btn .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg2);}
.nav-spacer{flex:1;}
.nav-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-top:8px;}

/* ── SIDEBAR ── */
.sidebar{width:290px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.panel.active{display:flex;}
.panel-hdr{padding:18px 14px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.sbox{padding:9px 11px;}
.sbox input{width:100%;padding:7px 11px 7px 30px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;}
.sbox input:focus{border-color:var(--accent);}
.sbox-wrap{position:relative;}
.sbox-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;}
.ls{flex:1;overflow-y:auto;padding:5px 7px;}
.ls::-webkit-scrollbar{width:3px;}
.ls::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sec-lbl{padding:6px 7px 2px;font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;font-family:'Syne',sans-serif;font-weight:600;}

/* friend / DM list items */
.fi{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;cursor:pointer;transition:background .15s;}
.fi:hover{background:var(--bg3);}
.fi.active{background:rgba(108,99,255,.15);}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex-shrink:0;position:relative;}
.av.sm{width:30px;height:30px;font-size:11px;}
.av.xs{width:24px;height:24px;font-size:9px;}
.sdot{position:absolute;bottom:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--text3);border:2px solid var(--bg2);}
.sdot.on{background:var(--green);}
.fi-info{flex:1;min-width:0;}
.fi-name{font-weight:600;font-size:13px;font-family:'Syne',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fi-sub{font-size:11px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fi-sub.on{color:var(--green);}
.fi-meta{text-align:right;flex-shrink:0;}
.fi-time{color:var(--text3);font-size:10px;}
.fi-acts{display:flex;gap:3px;}
.fbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;}
.fbtn:hover{border-color:var(--accent);color:var(--accent2);}
.fbtn.acc:hover{border-color:var(--green);color:var(--green);}
.fbtn.dec:hover{border-color:var(--red);color:var(--red);}
.req-count{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:5px;}

/* ── CHAT AREA ── */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--bg2);}
.chat-hdr-info{flex:1;}
.chat-hdr-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.chat-hdr-status{color:var(--text2);font-size:11px;margin-top:1px;}
.chat-hdr-acts{display:flex;gap:6px;}
.cbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;}
.cbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.cbtn.vid:hover{background:var(--accent3);border-color:var(--accent3);color:var(--bg);}
.cbtn.ai-btn{background:rgba(108,99,255,.12);border-color:rgba(108,99,255,.3);color:var(--accent2);}
.cbtn.ai-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── MESSAGES ── */
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;background:var(--bg);}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.mrow{display:flex;align-items:flex-end;gap:7px;}
.mrow.mine{flex-direction:row-reverse;}
.mrow.mine .mav{display:none;}
.mav{flex-shrink:0;}
.mbub{max-width:66%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.mbub.theirs{background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.mbub.mine{background:linear-gradient(135deg,var(--accent),#7c3aed);border-bottom-right-radius:4px;color:#fff;margin-left:auto;}
.mbub.call-ev{background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);color:var(--text2);font-size:12px;}
.mbub.ai-msg{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(108,99,255,.15));border:1px solid rgba(108,99,255,.25);border-bottom-left-radius:4px;color:var(--text);}
.mtime{font-size:10px;color:var(--text3);padding:0 3px;flex-shrink:0;align-self:flex-end;margin-bottom:2px;}
.day-div{text-align:center;color:var(--text3);font-size:10px;letter-spacing:1px;margin:10px 0;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--border);}

/* file bubble */
.file-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg4);border-radius:12px;max-width:260px;text-decoration:none;}
.file-icon{font-size:22px;flex-shrink:0;}
.file-info{flex:1;min-width:0;}
.file-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-size{font-size:11px;color:var(--text2);}

/* ai typing */
.ai-typing{display:flex;gap:4px;align-items:center;padding:10px 14px;}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:blink 1.2s infinite;}
.ai-typing span:nth-child(2){animation-delay:.2s;}
.ai-typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* ── INPUT ── */
.chat-input-area{padding:11px 18px;border-top:1px solid var(--border);background:var(--bg2);}
.file-preview-bar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.file-preview-bar.show{display:flex;}
.file-preview-name{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-preview-rm{width:20px;height:20px;border-radius:5px;border:none;background:var(--bg4);color:var(--text2);cursor:pointer;font-size:12px;}
.irow{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:15px;padding:8px 11px;transition:border-color .2s;}
.irow:focus-within{border-color:var(--accent);}
.attach-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:color .2s;}
.attach-btn:hover{color:var(--accent2);}
#msg-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;resize:none;max-height:120px;line-height:1.5;}
#msg-input::placeholder{color:var(--text3);}
.send-btn{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:opacity .2s;}
.send-btn:hover{opacity:.85;}
#file-input{display:none;}

/* ── EMPTY STATE ── */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:11px;}
.empty-state .ei{font-size:50px;}
.empty-state h3{font-family:'Syne',sans-serif;color:var(--text2);font-size:17px;}

/* ── MODALS ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-ov.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:26px;width:390px;box-shadow:0 40px 80px rgba(0,0,0,.5);}
.modal h2{font-size:17px;margin-bottom:16px;}
.usr-res{max-height:200px;overflow-y:auto;margin-top:7px;}
.ures{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer;transition:background .15s;justify-content:space-between;}
.ures:hover{background:var(--bg3);}
.ures-l{display:flex;align-items:center;gap:9px;}
.modal-acts{display:flex;gap:8px;margin-top:16px;}
.btn-sec{flex:1;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Syne',sans-serif;font-weight:600;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-sec:hover{border-color:var(--accent);color:var(--accent);}
.bsm{padding:4px 11px;border-radius:7px;border:none;font-family:'Syne',sans-serif;font-weight:600;font-size:11px;cursor:pointer;}
.bsm.add{background:var(--accent);color:#fff;}
.bsm.pend{background:var(--bg4);color:var(--text3);cursor:default;}
.icon-btn{width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;transition:all .2s;}
.icon-btn:hover{color:var(--accent2);border-color:var(--accent);}

/* ── CALL OVERLAYS ── */
#call-overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2000;background:radial-gradient(ellipse at center,#1a1040 0%,#0a0a0f 70%);}
#call-overlay.show{display:flex;}
.call-av{width:105px;height:105px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:42px;margin-bottom:20px;animation:pulse-ring 2s infinite;}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(108,99,255,.4),0 0 60px rgba(108,99,255,.3);}50%{box-shadow:0 0 0 18px rgba(108,99,255,0),0 0 80px rgba(108,99,255,.5);}}
.call-name{font-family:'Syne',sans-serif;font-weight:800;font-size:25px;margin-bottom:7px;}
.call-status{color:var(--text2);font-size:14px;margin-bottom:40px;}
.call-ctrls{display:flex;gap:16px;align-items:center;}
.cctrl{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;}
.cctrl.mute{background:var(--bg3);color:var(--text);}
.cctrl.end{background:var(--red);color:#fff;width:64px;height:64px;font-size:22px;}
.cctrl.end:hover{background:#e11d48;}
.cctrl.spk{background:var(--bg3);color:var(--text);}
.call-timer{color:var(--text2);font-size:15px;font-family:'Syne',sans-serif;margin-bottom:12px;}
#video-overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:2000;}
#video-overlay.show{display:flex;}
#remote-video{width:100%;height:100%;object-fit:cover;background:#111;}
#local-video{position:absolute;bottom:115px;right:18px;width:145px;height:92px;border-radius:11px;object-fit:cover;border:2px solid var(--border);background:#222;}
.vid-ctrls{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;justify-content:center;gap:13px;background:linear-gradient(transparent,rgba(0,0,0,.8));}
.vid-info{position:absolute;top:16px;left:16px;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);}
#incoming-call{position:fixed;top:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:17px;padding:17px 20px;width:280px;display:none;z-index:3000;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideIn .3s ease;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
#incoming-call.show{display:block;}
.inc-title{color:var(--text2);font-size:10px;margin-bottom:5px;letter-spacing:1px;}
.inc-name{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:3px;}
.inc-type{color:var(--text2);font-size:12px;margin-bottom:13px;}
.inc-btns{display:flex;gap:7px;}
.btn-acc{flex:1;padding:9px;background:var(--green);border:none;border-radius:9px;color:var(--bg);font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;}
.btn-dec{flex:1;padding:9px;background:var(--red);border:none;border-radius:9px;color:#fff;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;}

/* ── AI PANEL ── */
#ai-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:flex-end;z-index:1500;padding:20px;}
#ai-overlay.show{display:flex;}
.ai-panel{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:380px;height:520px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.ai-hdr{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ai-hdr-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:16px;}
.ai-hdr-info{flex:1;}
.ai-hdr-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.ai-hdr-model{font-size:10px;color:var(--text3);}
.ai-close{width:28px;height:28px;border-radius:7px;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px;}
.ai-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.ai-msgs::-webkit-scrollbar{width:3px;}
.ai-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ai-irow{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}
#ai-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;resize:none;max-height:80px;line-height:1.5;}
#ai-input::placeholder{color:var(--text3);}
.ai-send{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--text);opacity:0;transition:opacity .3s;z-index:4000;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo"><div class="logo-icon">💬</div><h1>Horizen<span>Messages</span></h1></div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div id="login-form">
      <div class="fg"><label>EMAIL</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="fg"><label>PASSWORD</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    </div>
    <div id="signup-form" style="display:none">
      <div class="fg"><label>USERNAME</label><input type="text" id="signup-username" placeholder="yourname"></div>
      <div class="fg"><label>EMAIL</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="fg"><label>PASSWORD</label><input type="password" id="signup-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doSignup()"></div>
      <button class="btn-primary" onclick="doSignup()">Create Account →</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Nav Rail -->
  <div class="nav-rail">
    <div class="nav-logo">💬</div>
    <button class="nav-btn active" id="nav-friends" onclick="switchPanel('friends')" title="Messages">💬</button>
    <button class="nav-btn" id="nav-add" onclick="switchPanel('add')" title="Friends">
      👥<span class="badge" id="req-badge" style="display:none"></span>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" onclick="doLogout()" title="Sign out" style="font-size:15px">🚪</button>
    <div class="nav-me" id="my-av">?</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- FRIENDS / DMs PANEL -->
    <div class="panel active" id="panel-friends">
      <div class="panel-hdr">
        <div class="panel-title">Messages</div>
        <button class="icon-btn" onclick="showAddFriendModal()" title="Add friend">➕</button>
      </div>
      <div class="sbox"><div class="sbox-wrap"><span class="sbox-icon">🔍</span><input type="text" id="friend-search" placeholder="Search..." oninput="filterFriends()"></div></div>
      <div class="ls" id="friend-list"><div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">Loading...</div></div>
    </div>

    <!-- ADD FRIENDS PANEL -->
    <div class="panel" id="panel-add">
      <div class="panel-hdr">
        <div class="panel-title">Friends <span id="req-count-label"></span></div>
        <button class="icon-btn" onclick="showAddFriendModal()" title="Add">➕</button>
      </div>
      <div class="sbox"><div class="sbox-wrap"><span class="sbox-icon">🔍</span><input type="text" id="pending-search" placeholder="Search..." oninput="filterPending()"></div></div>
      <div class="ls" id="pending-list"><div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">Loading...</div></div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="ei">💬</div>
      <h3>Click a friend to chat</h3>
      <p>Your messages are saved privately</p>
    </div>
    <div id="active-chat" style="display:none;flex-direction:column;height:100%">
      <div class="chat-hdr">
        <div class="av sm" id="chat-av">?</div>
        <div class="chat-hdr-info">
          <div class="chat-hdr-name" id="chat-name">...</div>
          <div class="chat-hdr-status" id="chat-status">...</div>
        </div>
        <div class="chat-hdr-acts">
          <button class="cbtn ai-btn" onclick="toggleAI()" title="Ask AI">🤖</button>
          <button class="cbtn" onclick="startCall('audio')" title="Voice call">📞</button>
          <button class="cbtn vid" onclick="startCall('video')" title="Video call">📹</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chat-input-area">
        <div class="file-preview-bar" id="file-preview-bar">
          <span style="font-size:18px" id="file-preview-icon">📎</span>
          <span class="file-preview-name" id="file-preview-name"></span>
          <button class="file-preview-rm" onclick="clearFile()">✕</button>
        </div>
        <div class="irow">
          <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">📎</button>
          <input type="file" id="file-input" onchange="onFileSelected(this)">
          <textarea id="msg-input" placeholder="Type a message..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
            oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD FRIEND MODAL -->
<div class="modal-ov" id="add-friend-modal">
  <div class="modal">
    <h2>Add Friend</h2>
    <div class="fg"><label>SEARCH BY USERNAME</label><input type="text" id="friend-user-search" placeholder="Search username..." oninput="searchUsersForFriend()"></div>
    <div class="usr-res" id="friend-user-results"></div>
    <div class="modal-acts"><button class="btn-sec" onclick="closeAddFriendModal()">Close</button></div>
  </div>
</div>

  <div class="call-av" id="call-av">?</div>
  <div class="call-name" id="call-name">...</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
dayjs.extend(dayjs_plugin_relativeTime);

const SUPABASE_URL = 'https://eekwlctegngxdzannddi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YhaRLUgoEVB6iFTMJRwwEw_Bi7v-Qnq';
const GROQ_KEY    = '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'; // replace with your key
const GROQ_MODEL  = 'openai/gpt-oss-120b';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// STATE
let me = null, myProfile = null;
let friends = [], pendingReqs = [];
let activeFriend = null, chatMsgs = [], msgSub = null;
let callSub = null, friendSub = null;
let activeCall = null, localStream = null, peerConn = null;
let callTimerInterval = null, callSeconds = 0, isMuted = false, isCameraOff = false;
let incomingCallData = null;
let pendingFile = null;
let aiHistory = [];

// ─── AUTH ───
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
}
function showAuthErr(m) { const e=document.getElementById('auth-error'); e.textContent=m; e.style.display='block'; }
async function doLogin() {
  const email=document.getElementById('login-email').value.trim(), pass=document.getElementById('login-pass').value;
  if(!email||!pass) return showAuthErr('Fill in all fields');
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error) return showAuthErr(error.message);
  onAuth(data.user);
}
async function doSignup() {
  const username=document.getElementById('signup-username').value.trim();
  const email=document.getElementById('signup-email').value.trim();
  const pass=document.getElementById('signup-pass').value;
  if(!username||!email||!pass) return showAuthErr('Fill in all fields');
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error) return showAuthErr(error.message);
  if(data.user){
    const {error:pe}=await sb.from('profiles').insert({id:data.user.id,username,display_name:username,status:'online'});
    if(pe) return showAuthErr(pe.message);
    onAuth(data.user);
  } else showAuthErr('Check your email to confirm');
}
async function doLogout() {
  if(myProfile) await sb.from('profiles').update({status:'offline',last_seen:new Date().toISOString()}).eq('id',myProfile.id);
  await sb.auth.signOut(); location.reload();
}
async function onAuth(user) {
  me = user;
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!p) return showAuthErr('Profile not found. Please sign up.');
  myProfile=p;
  await sb.from('profiles').update({status:'online'}).eq('id',user.id);
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  document.getElementById('my-av').textContent=p.username[0].toUpperCase();
  loadFriends();
  subscribeCallEvents();
  subscribeFriendEvents();
}

// ─── PANELS ───
function switchPanel(name) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
}

// ─── FRIENDS ───
async function loadFriends() {
  const {data:acc}=await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*), addressee:profiles!friendships_addressee_id_fkey(*)')
    .or(`requester_id.eq.${myProfile.id},addressee_id.eq.${myProfile.id}`)
    .eq('status','accepted');
  friends=(acc||[]).map(f=>f.requester_id===myProfile.id?f.addressee:f.requester);

  const {data:pend}=await sb.from('friendships')
    .select('*, requester:profiles!friendships_requester_id_fkey(*)')
    .eq('addressee_id',myProfile.id).eq('status','pending');
  pendingReqs=pend||[];

  renderFriendList();
  renderPendingList();
  updateReqBadge();
}

function updateReqBadge() {
  const b=document.getElementById('req-badge'), l=document.getElementById('req-count-label');
  if(pendingReqs.length){ b.style.display='block'; l.innerHTML=`<span class="req-count">${pendingReqs.length}</span>`; }
  else { b.style.display='none'; l.innerHTML=''; }
}

async function renderFriendList() {
  const el=document.getElementById('friend-list');
  if(!friends.length){ el.innerHTML='<div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">No friends yet.<br>Click ➕ to add someone!</div>'; return; }
  el.innerHTML='';
  // For each friend, get last message between us
  for(const f of friends){
    const {data:last}=await sb.from('messages')
      .select('*')
      .or(`and(sender_id.eq.${myProfile.id},sent_to.eq.${f.id}),and(sender_id.eq.${f.id},sent_to.eq.${myProfile.id})`)
      .order('created_at',{ascending:false}).limit(1);
    const lm=last?.[0];
    const isOnline=f.status==='online';
    const item=document.createElement('div');
    item.className=`fi${activeFriend?.id===f.id?' active':''}`;
    item.dataset.fid=f.id;
    item.onclick=()=>openChat(f);
    const preview=lm?(lm.type==='file'?`📎 ${lm.content}`:(lm.type==='call'?'📞 Call':lm.content.substring(0,36))):'Say hello!';
    item.innerHTML=`
      <div class="av">${f.username[0].toUpperCase()}<div class="sdot ${isOnline?'on':''}"></div></div>
      <div class="fi-info">
        <div class="fi-name">${f.display_name||f.username}</div>
        <div class="fi-sub">${preview}</div>
      </div>
      <div class="fi-meta"><div class="fi-time">${lm?dayjs(lm.created_at).fromNow(true):''}</div></div>
    `;
    el.appendChild(item);
  }
}

function filterFriends() {
  const q=document.getElementById('friend-search').value.toLowerCase();
  document.querySelectorAll('#friend-list .fi').forEach(e=>{
    e.style.display=e.querySelector('.fi-name').textContent.toLowerCase().includes(q)?'':'none';
  });
}

function renderPendingList() {
  const el=document.getElementById('pending-list');
  el.innerHTML='';
  if(!pendingReqs.length&&!friends.length){ el.innerHTML='<div style="padding:18px;color:var(--text3);text-align:center;font-size:13px">No pending requests</div>'; return; }
  if(pendingReqs.length){
    const s=document.createElement('div'); s.className='sec-lbl'; s.textContent=`Requests (${pendingReqs.length})`; el.appendChild(s);
    pendingReqs.forEach(req=>{
      const d=document.createElement('div'); d.className='fi';
      d.innerHTML=`<div class="av xs">${req.requester.username[0].toUpperCase()}</div>
        <div class="fi-info"><div class="fi-name">${req.requester.display_name||req.requester.username}</div><div class="fi-sub">Friend request</div></div>
        <div class="fi-acts"><button class="fbtn acc" onclick="acceptFriend('${req.id}')" title="Accept">✓</button><button class="fbtn dec" onclick="declineFriend('${req.id}')" title="Decline">✕</button></div>`;
      el.appendChild(d);
    });
  }
  if(friends.length){
    const s=document.createElement('div'); s.className='sec-lbl'; s.textContent=`Friends (${friends.length})`; el.appendChild(s);
    friends.forEach(f=>{
      const d=document.createElement('div'); d.className='fi'; d.onclick=()=>{switchPanel('friends');openChat(f);};
      const isOnline=f.status==='online';
      d.innerHTML=`<div class="av xs">${f.username[0].toUpperCase()}<div class="sdot ${isOnline?'on':''}"></div></div>
        <div class="fi-info"><div class="fi-name">${f.display_name||f.username}</div><div class="fi-sub ${isOnline?'on':''}">${isOnline?'● Online':`Last seen ${dayjs(f.last_seen).fromNow()}`}</div></div>`;
      el.appendChild(d);
    });
  }
}

function filterPending() {
  const q=document.getElementById('pending-search').value.toLowerCase();
  document.querySelectorAll('#pending-list .fi').forEach(e=>{
    e.style.display=e.querySelector('.fi-name')?.textContent.toLowerCase().includes(q)?'':'none';
  });
}

async function acceptFriend(id){ await sb.from('friendships').update({status:'accepted'}).eq('id',id); await loadFriends(); showToast('Friend added!'); }
async function declineFriend(id){ await sb.from('friendships').delete().eq('id',id); await loadFriends(); }

function subscribeFriendEvents() {
  friendSub=sb.channel(`fr:${myProfile.id}`)
    .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>loadFriends())
    .subscribe();
}

// ADD FRIEND MODAL
function showAddFriendModal(){ document.getElementById('add-friend-modal').classList.add('show'); document.getElementById('friend-user-results').innerHTML=''; document.getElementById('friend-user-search').value=''; }
function closeAddFriendModal(){ document.getElementById('add-friend-modal').classList.remove('show'); }
async function searchUsersForFriend(){
  const q=document.getElementById('friend-user-search').value.trim(), res=document.getElementById('friend-user-results');
  if(q.length<2){ res.innerHTML=''; return; }
  const {data}=await sb.from('profiles').select('*').ilike('username',`%${q}%`).neq('id',myProfile.id).limit(8);
  const {data:ex}=await sb.from('friendships').select('*').or(`requester_id.eq.${myProfile.id},addressee_id.eq.${myProfile.id}`);
  const exMap={}; (ex||[]).forEach(f=>{ const o=f.requester_id===myProfile.id?f.addressee_id:f.requester_id; exMap[o]=f.status; });
  res.innerHTML='';
  (data||[]).forEach(user=>{
    const st=exMap[user.id];
    const btn=st==='accepted'?`<span class="bsm pend">Friends ✓</span>`:st==='pending'?`<span class="bsm pend">Pending…</span>`:`<button class="bsm add" onclick="sendFriendReq('${user.id}',this)">Add</button>`;
    const d=document.createElement('div'); d.className='ures';
    d.innerHTML=`<div class="ures-l"><div class="av xs">${user.username[0].toUpperCase()}</div><div><div style="font-weight:600;font-size:13px;font-family:'Syne',sans-serif">${user.display_name||user.username}</div><div style="color:var(--text2);font-size:11px">@${user.username}</div></div></div>${btn}`;
    res.appendChild(d);
  });
  if(!data?.length) res.innerHTML='<div style="color:var(--text3);font-size:13px;padding:10px">No users found</div>';
}
async function sendFriendReq(id,btn){
  const {error}=await sb.from('friendships').insert({requester_id:myProfile.id,addressee_id:id,status:'pending'});
  if(error) return showToast(error.message);
  btn.textContent='Pending…'; btn.className='bsm pend'; btn.disabled=true; showToast('Request sent!');
}

// ─── OPEN CHAT ───
async function openChat(friend) {
  activeFriend=friend;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('active-chat').style.display='flex';
  document.getElementById('chat-av').textContent=(friend.display_name||friend.username)[0].toUpperCase();
  document.getElementById('chat-name').textContent=friend.display_name||friend.username;
  document.getElementById('chat-status').textContent=friend.status==='online'?'● Online':`Last seen ${dayjs(friend.last_seen).fromNow()}`;
  document.querySelectorAll('.fi').forEach(e=>e.classList.toggle('active',e.dataset.fid===friend.id));
  if(msgSub) msgSub.unsubscribe();
  await loadChatMsgs();
  // Subscribe to new messages between us
  msgSub=sb.channel(`dm:${[myProfile.id,friend.id].sort().join('-')}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
      const m=p.new;
      const relevant=(m.sender_id===myProfile.id&&m.sent_to===friend.id)||(m.sender_id===friend.id&&m.sent_to===myProfile.id);
      if(relevant) appendMsg(m);
    })
    .subscribe();
}

async function loadChatMsgs(){
  const {data}=await sb.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${myProfile.id},sent_to.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},sent_to.eq.${myProfile.id})`)
    .order('created_at',{ascending:true});
  chatMsgs=data||[];
  renderMsgs();
}

function renderMsgs(){
  const c=document.getElementById('msgs'); c.innerHTML='';
  let lastD=null;
  for(const m of chatMsgs){
    const d=dayjs(m.created_at).format('MMMM D, YYYY');
    if(d!==lastD){ const dv=document.createElement('div'); dv.className='day-div'; dv.textContent=d; c.appendChild(dv); lastD=d; }
    renderOneMsg(m,c);
  }
  c.scrollTop=c.scrollHeight;
}

function appendMsg(m){
  chatMsgs.push(m);
  renderOneMsg(m,document.getElementById('msgs'));
  document.getElementById('msgs').scrollTop=9999;
  renderFriendList();
}

function renderOneMsg(m,c){
  const mine=m.sender_id===myProfile.id;
  const row=document.createElement('div');
  row.className=`mrow ${mine?'mine':''}`;
  const initials=activeFriend?(activeFriend.display_name||activeFriend.username)[0].toUpperCase():'?';
  const timeStr=dayjs(m.created_at).format('h:mm A');

  let inner='';
  if(m.type==='call'){
    inner=`<div class="mbub call-ev" style="${mine?'margin-left:auto':''}">📞 ${m.content}</div><div class="mtime">${timeStr}</div>`;
  } else if(m.type==='file'){
    const icon=fileIcon(m.content);
    const fileBub=`<a class="file-bubble" href="${m.file_url||'#'}" target="_blank" download>
      <span class="file-icon">${icon}</span>
      <div class="file-info"><div class="file-name">${escH(m.content)}</div><div class="file-size">${m.file_size?fmtSize(m.file_size):''}</div></div>
      <span style="color:var(--accent2);font-size:13px">⬇</span></a>`;
    if(mine) inner=`<div class="mtime">${timeStr}</div>${fileBub}`;
    else inner=`<div class="av xs mav">${initials}</div>${fileBub}<div class="mtime">${timeStr}</div>`;
  } else {
    if(mine) inner=`<div class="mtime">${timeStr}</div><div class="mbub mine">${escH(m.content)}</div>`;
    else inner=`<div class="av xs mav">${initials}</div><div class="mbub theirs">${escH(m.content)}</div><div class="mtime">${timeStr}</div>`;
  }
  row.innerHTML=inner;
  c.appendChild(row);
}

function escH(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function fmtSize(b){ if(b>1048576) return (b/1048576).toFixed(1)+' MB'; if(b>1024) return (b/1024).toFixed(0)+' KB'; return b+' B'; }
function fileIcon(name){ const e=name.split('.').pop().toLowerCase(); const m={pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',mp4:'🎬',mp3:'🎵',zip:'🗜️',rar:'🗜️'}; return m[e]||'📎'; }

// ─── SEND MESSAGE ───
async function sendMessage(){
  if(!activeFriend) return;
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text&&!pendingFile) return;
  input.value=''; input.style.height='';

  if(pendingFile){
    await uploadAndSend(pendingFile, text);
    clearFile();
  } else {
    await sb.from('messages').insert({sender_id:myProfile.id,sent_to:activeFriend.id,content:text,type:'text'});
  }
}

// ─── FILE UPLOAD ───
function onFileSelected(input){
  const f=input.files[0]; if(!f) return;
  pendingFile=f;
  document.getElementById('file-preview-icon').textContent=fileIcon(f.name);
  document.getElementById('file-preview-name').textContent=f.name;
  document.getElementById('file-preview-bar').classList.add('show');
  input.value='';
}
function clearFile(){ pendingFile=null; document.getElementById('file-preview-bar').classList.remove('show'); }

async function uploadAndSend(file, caption){
  try {
    const ext=file.name.split('.').pop();
    const path=`dm-files/${myProfile.id}/${Date.now()}.${ext}`;
    const {error:ue}=await sb.storage.from('horizenmessages').upload(path,file,{cacheControl:'3600',upsert:false});
    if(ue) throw ue;
    const {data:urlData}=sb.storage.from('horizenmessages').getPublicUrl(path);
    await sb.from('messages').insert({
      sender_id:myProfile.id,
      sent_to:activeFriend.id,
      content:file.name,
      type:'file',
      file_url:urlData.publicUrl,
      file_size:file.size
    });
    if(caption) await sb.from('messages').insert({sender_id:myProfile.id,sent_to:activeFriend.id,content:caption,type:'text'});
  } catch(e){ showToast('File upload failed: '+e.message); }
}

function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

// ─── AI ───
function toggleAI(){
  const o=document.getElementById('ai-overlay');
  o.classList.toggle('show');
}
async function sendAI(){
  const inp=document.getElementById('ai-input');
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='';
  const aiMsgs=document.getElementById('ai-msgs');
  // User bubble
  const urow=document.createElement('div'); urow.className='mrow mine';
  urow.innerHTML=`<div class="mbub mine">${escH(text)}</div>`;
  aiMsgs.appendChild(urow);
  // Typing
  const trow=document.createElement('div'); trow.className='mrow';
  trow.innerHTML=`<div class="av xs" style="background:linear-gradient(135deg,var(--accent),var(--accent3));flex-shrink:0">🤖</div><div class="mbub theirs ai-typing-bub"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  aiMsgs.appendChild(trow); aiMsgs.scrollTop=9999;
  aiHistory.push({role:'user',content:text});
  try {
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:'You are Horizen AI, a helpful assistant inside HorizenMessages. Be concise and friendly.'},...aiHistory],max_tokens:1024})
    });
    const json=await res.json();
    const reply=json.choices?.[0]?.message?.content||'Sorry, I could not respond.';
    aiHistory.push({role:'assistant',content:reply});
    trow.innerHTML=`<div class="av xs" style="background:linear-gradient(135deg,var(--accent),var(--accent3));flex-shrink:0;display:flex;align-items:center;justify-content:center">🤖</div><div class="mbub ai-msg" style="margin-left:7px">${escH(reply)}</div>`;
  } catch(e){
    trow.innerHTML=`<div class="av xs" style="background:linear-gradient(135deg,var(--accent),var(--accent3));flex-shrink:0">🤖</div><div class="mbub theirs" style="margin-left:7px;color:var(--red)">Error: ${e.message}</div>`;
  }
  aiMsgs.scrollTop=9999;
}

// ─── CALLS ───
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function subscribeCallEvents(){
  callSub=sb.channel(`calls:${myProfile.id}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'calls'},async p=>{
      const call=p.new;
      if(call.caller_id!==myProfile.id){
        const {data:caller}=await sb.from('profiles').select('*').eq('id',call.caller_id).single();
        if(caller) showIncomingCall(call,caller);
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'calls'},p=>handleCallUpdate(p.new))
    .subscribe();
}
async function startCall(type){
  if(!activeFriend) return;
  if(activeCall) return showToast('Already in a call');
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'}); }
  catch(e){ return showToast('Cannot access mic/camera'); }
  peerConn=new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));
  if(type==='video') document.getElementById('local-video').srcObject=localStream;
  peerConn.onicecandidate=async(e)=>{
    if(e.candidate&&activeCall){
      const {data:c}=await sb.from('calls').select('ice_candidates').eq('id',activeCall.id).single();
      const cands=c?.ice_candidates||[]; cands.push({side:'caller',candidate:e.candidate});
      await sb.from('calls').update({ice_candidates:cands}).eq('id',activeCall.id);
    }
  };
  peerConn.ontrack=e=>{ if(type==='video') document.getElementById('remote-video').srcObject=e.streams[0]; };
  const offer=await peerConn.createOffer(); await peerConn.setLocalDescription(offer);
  const {data:call}=await sb.from('calls').insert({conversation_id:null,caller_id:myProfile.id,type,status:'ringing',offer:JSON.stringify(offer)}).select().single();
  activeCall=call; showCallUI(type,activeFriend,'Calling...');
}
async function handleCallUpdate(call){
  if(!activeCall||call.id!==activeCall.id) return;
  activeCall=call;
  if(call.status==='active'&&call.answer&&peerConn&&peerConn.signalingState!=='stable'){
    try{
      await peerConn.setRemoteDescription(JSON.parse(call.answer));
      document.getElementById('call-status-text').textContent='Connected';
      startCallTimer();
      (call.ice_candidates||[]).forEach(async ic=>{if(ic.side==='callee') try{await peerConn.addIceCandidate(new RTCIceCandidate(ic.candidate));}catch(e){}});
    }catch(e){}
  }
  if(call.status==='ended') cleanupCall();
}
function showIncomingCall(call,caller){
  incomingCallData={call,caller};
  document.getElementById('inc-name').textContent=caller.display_name||caller.username;
  document.getElementById('inc-type').textContent=call.type==='video'?'📹 Video Call':'📞 Audio Call';
  document.getElementById('incoming-call').classList.add('show');
}
async function acceptCall(){
  document.getElementById('incoming-call').classList.remove('show');
  if(!incomingCallData) return;
  const {call,caller}=incomingCallData;
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:call.type==='video'}); }
  catch(e){ return showToast('Cannot access mic/camera'); }
  peerConn=new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));
  if(call.type==='video') document.getElementById('local-video').srcObject=localStream;
  peerConn.onicecandidate=async(e)=>{
    if(e.candidate){
      const {data:c}=await sb.from('calls').select('ice_candidates').eq('id',call.id).single();
      const cands=c?.ice_candidates||[]; cands.push({side:'callee',candidate:e.candidate});
      await sb.from('calls').update({ice_candidates:cands}).eq('id',call.id);
    }
  };
  peerConn.ontrack=e=>{ if(call.type==='video') document.getElementById('remote-video').srcObject=e.streams[0]; };
  await peerConn.setRemoteDescription(JSON.parse(call.offer));
  const answer=await peerConn.createAnswer(); await peerConn.setLocalDescription(answer);
  (call.ice_candidates||[]).forEach(async ic=>{if(ic.side==='caller') try{await peerConn.addIceCandidate(new RTCIceCandidate(ic.candidate));}catch(e){}});
  await sb.from('calls').update({status:'active',answer:JSON.stringify(answer)}).eq('id',call.id);
  activeCall={...call,status:'active'}; showCallUI(call.type,caller,'Connected'); startCallTimer(); incomingCallData=null;
}
async function declineCall(){
  document.getElementById('incoming-call').classList.remove('show');
  if(incomingCallData){ await sb.from('calls').update({status:'missed'}).eq('id',incomingCallData.call.id); incomingCallData=null; }
}
function showCallUI(type,partner,status){
  const name=partner.display_name||partner.username;
  if(type==='video'){ document.getElementById('video-overlay').classList.add('show'); document.getElementById('vid-call-name').textContent=name; }
  else { document.getElementById('call-overlay').classList.add('show'); document.getElementById('call-av').textContent=name[0].toUpperCase(); document.getElementById('call-name').textContent=name; document.getElementById('call-status-text').textContent=status; }
}
function startCallTimer(){
  callSeconds=0; document.getElementById('call-timer').style.display='block'; document.getElementById('call-status-text').style.display='none';
  callTimerInterval=setInterval(()=>{ callSeconds++; const m=Math.floor(callSeconds/60),s=callSeconds%60; document.getElementById('call-timer').textContent=`${m}:${s.toString().padStart(2,'0')}`; },1000);
}
async function endCall(){
  if(activeCall){
    const dur=callSeconds;
    await sb.from('calls').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',activeCall.id);
    if(activeFriend){
      await sb.from('messages').insert({sender_id:myProfile.id,sent_to:activeFriend.id,content:`${activeCall.type==='video'?'Video':'Voice'} call · ${dur>0?fmtDur(dur):'No answer'}`,type:'call'});
    }
  }
  cleanupCall();
}
function cleanupCall(){
  clearInterval(callTimerInterval); callSeconds=0;
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(peerConn){ peerConn.close(); peerConn=null; }
  document.getElementById('call-overlay').classList.remove('show');
  document.getElementById('video-overlay').classList.remove('show');
  document.getElementById('call-timer').style.display='none';
  document.getElementById('call-status-text').style.display='block';
  document.getElementById('call-status-text').textContent='Calling...';
  document.getElementById('remote-video').srcObject=null;
  document.getElementById('local-video').srcObject=null;
  activeCall=null; isMuted=false; isCameraOff=false;
}
function toggleMute(){ isMuted=!isMuted; if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); document.getElementById('mute-btn').textContent=isMuted?'🔇':'🎤'; document.getElementById('vid-mute-btn').textContent=isMuted?'🔇':'🎤'; }
function toggleCamera(){ isCameraOff=!isCameraOff; if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=!isCameraOff); }
function toggleSpeaker(){ showToast('Speaker toggled'); }
function fmtDur(s){ const m=Math.floor(s/60),sec=s%60; return m>0?`${m}m ${sec}s`:`${sec}s`; }
function showToast(msg){ const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2500); }

// INIT
sb.auth.getSession().then(({data})=>{ if(data.session?.user) onAuth(data.session.user); });
document.getElementById('add-friend-modal').addEventListener('click',function(e){ if(e.target===this) closeAddFriendModal(); });
document.getElementById('ai-overlay').addEventListener('click',function(e){ if(e.target===this) toggleAI(); });
