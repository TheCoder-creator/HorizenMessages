<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HorizenMessages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--panel:#161e36;--line:#26304f;--tx:#e8ecf7;--mut:#8a95b5;--ac:#6ea8ff;--ok:#4fd1a5;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Avenir Next",Segoe UI,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--ac);color:#08101f;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.r{background:var(--bad);color:#fff}
[hidden]{display:none!important}
#auth{display:grid;place-items:center;height:100%;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:grid;gap:10px}
.card h1{margin:0 0 4px;font-size:24px}.mut{color:var(--mut);font-size:13px}
#app{display:flex;height:100%}
#side{width:320px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#side header,#head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#side header b{flex:1}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;color:var(--mut);border-radius:0;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.list{overflow:auto;flex:1}
.row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;cursor:pointer}
.row:hover,.row.on{background:#1d2748}.row span{flex:1;overflow:hidden;text-overflow:ellipsis}
.pad{padding:12px 14px;display:grid;gap:8px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head b{flex:1}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:70%;padding:8px 12px;border-radius:14px;background:var(--panel);align-self:flex-start;word-wrap:break-word}
.m.me{background:var(--ac);color:#08101f;align-self:flex-end}
.m small{display:block;color:var(--mut);font-size:11px}.m.me small{color:#2b3a5e}
#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.empty{margin:auto;color:var(--mut);text-align:center}
#call{position:fixed;inset:0;background:#05080f;display:grid;grid-template-rows:1fr auto;z-index:9}
#rv{width:100%;height:100%;object-fit:contain;background:#000;min-height:0}
#lv{position:absolute;right:16px;top:16px;width:140px;border-radius:10px;border:1px solid var(--line);background:#000}
#cb{padding:16px;text-align:center}
#back{display:none}
@media(max-width:700px){#side{width:100%}#main{display:none}#app.open #side{display:none}#app.open #main{display:flex}#back{display:block}}

/* ---- Horizen glow theme ---- */
:root{--bg:#070a14;--panel:rgba(22,30,58,.62);--line:rgba(130,150,255,.16);--ac:#7c8cff;--ac2:#b46bff;--grad:linear-gradient(135deg,#6ea8ff,#7c5cff 55%,#c05bff)}
body{background:radial-gradient(900px 600px at 8% -10%,rgba(124,92,255,.35),transparent 60%),radial-gradient(800px 600px at 100% 110%,rgba(46,196,255,.22),transparent 60%),var(--bg);background-attachment:fixed}
.card,#side,#head,#send,.tabs{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.card{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset;animation:rise .5s ease both}
.card h1{font-size:28px;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
input{background:rgba(7,10,20,.6);border-radius:12px;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
button{background:var(--grad);color:#fff;border-radius:12px;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.4);filter:brightness(1.08)}
button:active{transform:none}
button.g{background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none}
button.g:hover{background:rgba(255,255,255,.1);box-shadow:none}
button.r{background:linear-gradient(135deg,#ff6b6b,#ff3d7f)}
#side{background:rgba(12,16,32,.55)}
#side header b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs button{background:none;box-shadow:none;transform:none;color:var(--mut)}
.tabs button.on{color:#fff;border-image:var(--grad) 1}
.row{margin:4px 8px;border:0;border-radius:14px;padding:10px 12px;transition:background .2s}
.row::before{content:"";width:38px;height:38px;flex:none;border-radius:50%;background:var(--grad);box-shadow:0 0 14px rgba(124,92,255,.5)}
.row:hover{background:rgba(255,255,255,.06)}.row.on{background:linear-gradient(90deg,rgba(124,140,255,.22),rgba(180,107,255,.1))}
#head{background:rgba(12,16,32,.55)}
#head b{font-size:17px}
#msgs{padding:20px 18px;gap:8px;scrollbar-width:thin;scrollbar-color:#2c3560 transparent}
.m{border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:9px 14px;animation:pop .25s ease both}
.m.me{border:0;border-radius:18px 18px 6px 18px;background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.35)}
.m.me small{color:rgba(255,255,255,.75)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#send{background:rgba(12,16,32,.55);padding:14px}
#send input{border-radius:999px;padding:12px 18px}#send button{border-radius:999px;padding:0 22px}
.empty{font-size:16px}
#call{background:radial-gradient(800px 500px at 50% 0,rgba(124,92,255,.3),#05080f 70%)}
#lv{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}#rv{border-radius:0}
/* ---- sleek type + new features ---- */
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,b{letter-spacing:-.025em}.card h1{font-weight:700}.mut,small{font-weight:500}
input,button{font-family:inherit}button{font-weight:550;letter-spacing:-.01em}
.m{position:relative;padding-right:30px}.m small{font-weight:500;letter-spacing:0}
.m .mb{position:absolute;top:4px;right:4px;padding:0 6px;background:none;box-shadow:none;color:inherit;opacity:.35;font-size:16px;line-height:1.2}
.m:hover .mb{opacity:1}.m .mb:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.12)}
.q{border-left:3px solid rgba(255,255,255,.4);padding:2px 8px;margin:4px 0;font-size:12.5px;opacity:.8;border-radius:3px}

.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rx span{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);cursor:pointer}
.rx span.mine{border-color:var(--ac);background:rgba(124,140,255,.28)}
.pop{position:absolute;z-index:5;top:100%;right:0;margin-top:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:260px;padding:8px;border-radius:14px;background:#161e36;border:1px solid var(--line);box-shadow:0 12px 36px rgba(0,0,0,.6)}

#rp{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;background:rgba(12,16,32,.55)}
#rp[hidden]{display:none}#rp button{padding:2px 8px;margin-left:auto}
#at{padding:0 15px;font-size:18px}
#st{font-size:12px;color:var(--mut);margin-top:1px}#st.ok{color:#4fd1a5}
.row.onl::before{box-shadow:0 0 0 2px #0b1020,0 0 0 4px #4fd1a5}
#inc{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,8,15,.78);backdrop-filter:blur(8px)}
#inc .card{text-align:center;max-width:320px}#inc .card>div:last-child{justify-content:center}
/* ---- settings, avatars, add members, toast ---- */
.row::before{background:var(--av,var(--grad)) center/cover}
#who{cursor:pointer;display:flex;align-items:center;gap:9px}
#who::before{content:"";width:30px;height:30px;flex:none;border-radius:50%;background:var(--av,var(--grad)) center/cover;box-shadow:0 0 12px rgba(124,92,255,.5)}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,8,15,.78);backdrop-filter:blur(8px)}
.ov .card{display:flex;flex-direction:column;gap:10px;min-width:280px;max-width:340px;max-height:85vh;overflow:auto}
.bigav{width:96px;height:96px;border-radius:50%;margin:0 auto;background:var(--av,var(--grad)) center/cover;box-shadow:0 0 28px rgba(124,92,255,.55)}
#sun{text-align:center;font-weight:600;font-size:16px;color:var(--tx)}
.pk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}.pk:hover{background:rgba(255,255,255,.06)}
.pk input{width:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:999px;background:#161e36;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* ---- eaglercraft party cards + game panel ---- */
.pty{display:flex;flex-direction:column;gap:3px;min-width:220px;padding:4px 0}
.pty b{font-size:15px}.pty span{font-size:12px;opacity:.8}.pty div{display:flex;gap:6px;margin-top:6px}
.pty button{padding:6px 12px;font-size:13px;position:static}
.m.me .pty button.g{background:rgba(255,255,255,.18);color:#fff}
#pg{position:fixed;top:0;right:0;bottom:0;width:min(100vw,68vw);z-index:15;display:flex;flex-direction:column;background:#070a14;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.6)}
#pg .top{padding:8px 12px;gap:8px}#pg .top b{flex:1}
#pgf{flex:1;width:100%;border:0;background:#000}
@media(max-width:700px){#pg{width:100vw}}
</style></head><body>

<section id="auth" hidden>
 <div class="card">
  <h1>HorizenMessages</h1>
  <input id="un" placeholder="Username (sign up only)" autocomplete="username">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="li">Log in</button>
  <button id="su" class="g">Create account</button>
  <div class="mut" style="text-align:center">or</div>
  <button id="gh" class="g" style="display:flex;align-items:center;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>Continue with GitHub</button>
  <div id="am" class="mut" role="status"></div>
 </div>
</section>

<section id="done" hidden>
 <div class="card"><h1 id="dh">Confirming…</h1><div class="mut" id="dm"></div><button id="go" hidden>Open HorizenMessages</button></div>
</section>

<div id="app" hidden>
 <aside id="side">
  <header><b id="who"></b><button class="g" id="lo">Log out</button></header>
  <div class="tabs"><button id="t1" class="on">Chats</button><button id="t2">Friends</button></div>
  <div id="chats" class="list"></div>
  <div id="friends" class="list" hidden>
   <div class="pad"><input id="fu" placeholder="Add friend by username"><button id="fa">Send request</button></div>
   <div id="fl"></div>
  </div>
 </aside>
 <main id="main">
  <div id="head" hidden>
   <button class="g" id="back">Back</button><div style="flex:1;min-width:0"><b id="cn"></b><div id="st"></div></div>
   <button class="g" id="ad" title="Add people" hidden>＋👤</button> <button class="g" id="ca">Call</button><button class="g" id="cv">Video call</button>
  </div>
  <div id="msgs"><div class="empty">Choose a chat, or add a friend to start one.</div></div>
  <div id="rp" hidden></div>
  <form id="send" hidden><button type="button" class="g" id="at" aria-label="Attach file">＋</button><input type="file" id="fi" hidden><input id="mi" placeholder="Write a message" autocomplete="off"><button>Send</button></form>
 </main>
</div>

<div id="set" class="ov" hidden><div class="card"><h1>Settings</h1><div id="sav" class="bigav"></div><div id="sun"></div>
 <button class="g" id="sup">Change profile icon</button><input type="file" id="sf" accept="image/*" hidden>
 <button class="g" id="sn">Enable notifications</button><button id="sx">Done</button><button class="r" id="slo">Log out</button></div></div>
<div id="pk" class="ov" hidden><div class="card"><h1>Add people</h1><div id="pl"></div><button id="pa">Add to group</button><button class="g" id="pc">Cancel</button></div></div>
<div id="pg" hidden><div class="top"><b id="pgt"></b><button class="g" id="pgo">Open in new tab</button><button class="r" id="pgx">Close</button></div><iframe id="pgf" title="Eaglercraft" allow="fullscreen; autoplay; keyboard-map; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
<div id="toast" hidden></div>
<div id="inc" hidden><div class="card"><h1 id="in"></h1><div class="mut" id="it"></div><div style="display:flex;gap:8px"><button id="ac">Answer</button><button class="r" id="dc">Decline</button></div></div></div>

<div id="call" hidden>
 <video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
 <div id="cb"><div id="cs" class="mut"></div><button class="g" id="mu">Mute</button> <button class="r" id="hu">Hang up</button></div>
</div>

<script>
const sb=supabase.createClient('https://wzfdomantqeaedfexpgq.supabase.co','sb_publishable_vrz02Sm0olhxPqgc1MihJg_mrEMh7MG');
// Link in the confirmation email. Replace website.com with your domain.
const CONFIRM_URL='https://website.com/email-confirmation';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,P={},convs=[],cur=null,started=false;

/* ---------- Auth + email confirmation ---------- */
const note=t=>$('am').textContent=t;
$('su').onclick=async()=>{
  const username=$('un').value.trim(),email=$('em').value.trim(),password=$('pw').value;
  if(!username||!email||password.length<6)return note('Enter a username, email and a password of 6+ characters.');
  const {error}=await sb.auth.signUp({email,password,options:{data:{username},emailRedirectTo:CONFIRM_URL}});
  if(error)return note(error.message);
  localStorage.setItem('email','confirmation'); // set when the confirmation email is sent
  note('Confirmation email sent. Open the link in it, then log in.');
};
$('li').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)note(error.message);
};
$('lo').onclick=()=>sb.auth.signOut().then(()=>location.href=location.pathname.replace(/email-confirmation.*/,''));
$('go').onclick=()=>{location.href=location.pathname.replace(/email-confirmation.*/,'')};

async function approved(u){const {data}=await sb.from('approved_acounts').select('user_id').eq('user_id',u.id).maybeSingle();return !!data}
async function confirmPage(){
  $('auth').hidden=true;$('app').hidden=true;$('done').hidden=false;
  const say=(h,m)=>{$('dh').textContent=h;$('dm').textContent=m};
  if(localStorage.getItem('email')!=='confirmation')return say('Can\u2019t confirm here','Open this link in the same browser you signed up with.');
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return say('Link not verified','Try the link in your email again.');
  const u=session.user,{error}=await sb.from('approved_acounts').upsert({user_id:u.id,email:u.email});
  if(error)return say('Activation failed',error.message);
  localStorage.removeItem('email');say('Email confirmed','Your account is activated.');$('go').hidden=false;
}
async function boot(){
  if(location.pathname.includes('email-confirmation'))return confirmPage();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('app').hidden=true;$('auth').hidden=false;return}
  if(await approved(session.user))start(session.user);
  else{await sb.auth.signOut({scope:'local'});$('app').hidden=true;$('auth').hidden=false;note('Your account isn\u2019t confirmed yet. Check your email for the link.')}
}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'){location.reload()}else if(e==='SIGNED_IN'&&s&&!started&&!location.pathname.includes('email-confirmation'))boot()});
boot();

async function start(u){
  if(started)return;started=true;me=u;
  $('auth').hidden=true;$('app').hidden=false;
  await loadProfiles();$('who').textContent=P[me.id]?.username||'Me';paintSet();document.addEventListener('click',()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(paintSet)},{once:true});
  await Promise.all([loadConvs(),loadFriends()]);
  sb.channel('db')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new.conversation_id===cur)addMsg(p.new);notifyMsg(p.new)})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{if(p.new.conversation_id===cur)addMsg(p.new)})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async()=>{await loadProfiles();loadConvs();loadFriends();paintSet()})
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},()=>{if(cur)loadReacts()})
   .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},loadFriends)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'conversation_members'},async p=>{await loadConvs();onAdded(p.new)}).subscribe();
  sb.channel('u:'+me.id).on('broadcast',{event:'sig'},({payload})=>onSig(payload)).subscribe();
  const pr=sb.channel('online',{config:{presence:{key:me.id}}});
  pr.on('presence',{event:'sync'},()=>{online=new Set(Object.keys(pr.presenceState()));paint()}).subscribe(st=>{if(st==='SUBSCRIBED')pr.track({at:Date.now()})});
  // Opened from Horizen OS: #sig=<incoming call>, #chat=<conversation id>
  const hs=location.hash;history.replaceState(null,'',location.pathname+location.search);
  const hm=hs.match(/^#sig=(.+)$/),hc=hs.match(/^#chat=([\w-]+)$/);
  if(hm){try{const w=JSON.parse(atob(decodeURIComponent(hm[1])));if(Date.now()-w.at<45000)onSig(w.p)}catch(e){}}
  else if(hc&&convs.find(c=>c.id===hc[1]))openConv(hc[1]);
}
async function loadProfiles(){const {data}=await sb.from('profiles').select('*');(data||[]).forEach(p=>P[p.id]=p)}
const uname=id=>P[id]?.username||'Unknown';

/* ---------- Tabs ---------- */
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function tab(n){$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);$('chats').hidden=n!=1;$('friends').hidden=n!=2}

/* ---------- Friends ---------- */
let fr=[];
async function loadFriends(){
  await loadProfiles();
  const {data}=await sb.from('friendships').select('*');fr=data||[];
  $('fl').innerHTML=fr.map(f=>{
    const other=f.requester===me.id?f.addressee:f.requester;
    if(f.status==='accepted')return `<div class="row" style="${av(other)}"><span>${esc(uname(other))}</span><button data-dm="${other}">Message</button></div>`;
    if(f.addressee===me.id)return `<div class="row"><span>${esc(uname(other))} wants to be friends</span><button data-ok="${f.id}">Accept</button></div>`;
    return `<div class="row"><span>${esc(uname(other))}</span><span class="mut">Request sent</span></div>`;
  }).join('')||'<div class="pad mut">No friends yet. Add one by username.</div>';
}

/* ---------- Calls: WebRTC signaled over Supabase Realtime broadcast ---------- */
let pc,stream,peer,pend=[],chans={},inc=null,ring;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
// wait until the channel is really joined before sending, so offers and ICE are never lost
const sch=id=>chans[id]||(chans[id]=new Promise((res,rej)=>{const c=sb.channel('u:'+id);
  c.subscribe(st=>{if(st==='SUBSCRIBED')res(c);else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st)){delete chans[id];sb.removeChannel(c);rej(new Error(st))}})}));
// send with one retry on a fresh channel; returns true when delivered to the server
async function sig(to,p){
  for(let i=0;i<2;i++){
    try{
      const c=await Promise.race([sch(to),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),6000))]);
      if(await c.send({type:'broadcast',event:'sig',payload:{...p,from:me.id}})==='ok')return true;
    }catch(e){}
    const old=chans[to];delete chans[to];if(old)old.then(c=>sb.removeChannel(c)).catch(()=>{});
  }
  return false;
}
// wait for ICE gathering so the whole offer/answer goes in ONE message (no trickle, no rate limits)
const gathered=()=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};
  pc.addEventListener('icegatheringstatechange',f);setTimeout(r,2500)});
async function setup(video){
  stream=await navigator.mediaDevices.getUserMedia({audio:true,video});
  $('lv').srcObject=stream;$('lv').hidden=!video;
  pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0];$('rv').play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;
    if(s==='connected'){clearTimeout(ring);$('cs').textContent='Connected'}
    if(s==='failed')$('cs').textContent='Connection failed. Your network may block calls.';
    if(s==='disconnected')$('cs').textContent='Reconnecting…'};
  $('call').hidden=false;$('cs').textContent='Calling '+uname(peer)+'…';$('mu').textContent='Mute';
}
async function startCall(video){
  const c=convs.find(c=>c.id===cur);if(!c||c.is_group)return;
  if(pc&&pc.connectionState==='connected')return;
  if(inc){sig(inc.from,{t:'end'});inc=null;$('inc').hidden=true}
  if(pc)hang(true);
  peer=other(c);
  try{await setup(video)}catch(e){hang(false);return alert('Allow microphone'+(video?' and camera':'')+' access to call.')}
  const o=await pc.createOffer();await pc.setLocalDescription(o);await gathered();
  if(!pc)return;
  if(!(await sig(peer,{t:'offer',sdp:pc.localDescription,video}))){hang(false);return alert('Couldn’t reach the call server. Check your connection and try again.')}
  ring=setTimeout(()=>{if(pc&&pc.connectionState!=='connected'){hang(true);alert('No answer.')}},45000);
}
$('ca').onclick=()=>startCall(false);$('cv').onclick=()=>startCall(true);
async function flush(){for(const c of pend)await pc.addIceCandidate(c).catch(()=>{});pend=[]}
async function onSig(p){
  if(p.t==='offer'){
    if(inc&&inc.from===p.from)inc=null;
    if(pc&&pc.connectionState!=='connected'&&p.from===peer)hang(false);
    if(pc||inc)return sig(p.from,{t:'busy'});
    inc=p;p.x=setTimeout(()=>{if(inc===p){inc=null;$('inc').hidden=true}},50000);ping(uname(p.from),p.video?'Incoming video call':'Incoming voice call','call');$('in').textContent=uname(p.from);$('it').textContent=p.video?'Incoming video call':'Incoming voice call';$('inc').hidden=false;
  }else if(p.t==='answer'&&pc&&p.from===peer){await pc.setRemoteDescription(p.sdp);await flush()}
  else if(p.t==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(p.c).catch(()=>{}):pend.push(p.c)}
  else if(p.t==='end'&&inc&&p.from===inc.from){inc=null;pend=[];$('inc').hidden=true}
  else if((p.t==='end'||p.t==='busy')&&pc&&p.from===peer){if(p.t==='busy')alert('They are on another call.');hang(false)}
}
$('ac').onclick=async()=>{
  const p=inc;inc=null;$('inc').hidden=true;peer=p.from;
  try{await setup(p.video)}catch(e){hang(true);return alert('Allow microphone'+(p.video?' and camera':'')+' access to answer.')}
  await pc.setRemoteDescription(p.sdp);await flush();
  const a=await pc.createAnswer();await pc.setLocalDescription(a);await gathered();
  if(!pc)return;if(!(await sig(peer,{t:'answer',sdp:pc.localDescription}))){hang(false);alert('Couldn’t reach them. Try again.')}
};
$('dc').onclick=()=>{sig(inc.from,{t:'end'});inc=null;pend=[];$('inc').hidden=true};
$('mu').onclick=()=>{const t=stream&&stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mu').textContent=t.enabled?'Mute':'Unmute'}};
function hang(notify){
  clearTimeout(ring);if(notify&&peer)sig(peer,{t:'end'});
  stream&&stream.getTracks().forEach(t=>t.stop());pc&&pc.close();
  pc=stream=peer=null;pend=[];$('call').hidden=true;$('rv').srcObject=$('lv').srcObject=null;
}

    const r=await fetch(EG_SB+'/rest/v1/parties',{method:'POST',headers:{apikey:EG_KEY,Authorization:'Bearer '+EG_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({code,server,name})});
    if(r.status===409)continue;
    return r.ok?code:null;
  }
  return null;
}
async function eagler(text){
  const m=text.match(/^@eaglercraft\b\s*(.*)$/i);if(!m)return false;
  const mm=m[1].match(/^party\s+create\s+(.+)$/i);
  if(!mm){toast('Try: @eaglercraft party create Friday build night');return true}
  const [nameRaw,srvRaw]=mm[1].split('|'),name=nameRaw.trim().replace(/::/g,' ').slice(0,40);
  const server=egServer(srvRaw&&srvRaw.trim()?srvRaw:DEFAULT_SERVER);
  if(!name)return toast('Give your party a name.'),true;
  if(!server)return toast('That server address doesn’t look right.'),true;
  toast('Creating your party…');
  const code=await makeParty(name,server);
  if(!code)return toast('Couldn’t create the party. Try again.'),true;
  // the invite is a normal message, so everyone in the group (or the other person in a DM) gets it and is notified
  const {error}=await sb.from('messages').insert({conversation_id:cur,sender_id:me.id,body:`::party::${code}::${name}`});
  if(error)alert(error.message);
  return true;
}
function playParty(code){openPanel(partyUrl(code),'🎮 Eaglercraft · '+code,false)}
$('pgx').onclick=()=>{$('pgf').src='about:blank';$('pg').hidden=true};

/* ---------- @game <name or site> : play in the side panel ---------- */
// Add your own shortcuts here: key (what people type) -> title + url
const GAMES={
  gd:{title:'Geometry Dash',url:'https://gd.horizensearch.com'},
  bloxd:{title:'Bloxd.io',url:'https://bloxd.io'},
  minecraft:{title:'Minecraft (Eaglercraft)',url:EAGLER_URL},
};
const gameUrl=r=>GAMES[r]?GAMES[r].url:(/^https:\/\/[^\s:]+$/i.test(r)?r:null);
function gameRef(tok){
  tok=tok.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');
  if(GAMES[tok])return {ref:tok,title:GAMES[tok].title};
  for(const [k,g] of Object.entries(GAMES))if(new URL(g.url).host===tok)return {ref:k,title:g.title};
  if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/[^\s:]*)?$/.test(tok))return {ref:'https://'+tok,title:tok.split('/')[0]};
  return null;
}
async function gameCmd(text){
  const m=text.match(/^@game\b\s*(\S*)/i);if(!m)return false;
  if(!m[1]||/^(list|help)$/i.test(m[1]))return toast('Try '+Object.keys(GAMES).map(k=>'@game '+k).join(' · ')+' · or any site like @game 2048.org'),true;
  const g=gameRef(m[1]);if(!g)return toast('Try @game gd, @game bloxd.io or @game list'),true;
  const {error}=await sb.from('messages').insert({conversation_id:cur,sender_id:me.id,body:`::game::${g.ref}::${g.title}`});
  if(error)alert(error.message);
  return true;
}
function openPanel(url,title,boxed){
  $('pgt').textContent=title;$('pgo').onclick=()=>window.open(url,'_blank','noopener');
  const f=$('pgf');f.removeAttribute('src');
  // sites that aren't in the shortcut list above run sandboxed
  if(boxed)f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups');else f.removeAttribute('sandbox');
  f.src=url;$('pg').hidden=false;
}
function playGame(ref,title){const u=gameUrl(ref);if(u)openPanel(u,'🕹️ '+(title||new URL(u).host),!GAMES[ref])}
